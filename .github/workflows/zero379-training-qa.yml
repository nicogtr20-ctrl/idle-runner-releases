name: ZERO379 one-room editor and V3 continuity (no OTA)
on:
  push:
    branches: [feature/zero379-single-training-room]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android-training:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build real Android app and instrumented training test
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Allow KVM emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real editor, save transitions, physical walls and existing motor regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            for fixture in Zero379SingleTrainingRoomAndroidTest Zero378PhysicalMotorCreditAndroidTest; do
              adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "/tmp/$fixture.txt"
              grep -q "OK (" "/tmp/$fixture.txt"
              ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "/tmp/$fixture.txt"
            done
      - name: Store test logs and unsigned candidate (never OTA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero379-training-candidate-no-ota
          path: |
            /tmp/Zero379*.txt
            /tmp/Zero378*.txt
            app/build/outputs/apk/debug/app-debug.apk
