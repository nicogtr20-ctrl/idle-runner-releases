name: ZERO 1170 Simultaneous Gate and Square QA
on:
  push:
    branches: [fix/overmind-v1170-gate-box-grip-isolation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile real world solvers and cognitive regressions
        run: |
          mkdir -p /tmp/zero1170
          javac -d /tmp/zero1170 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,OpticalCues,OpticalCueRegression,HabitatContinuity,SquareCollisionSolver,SquareGripPuzzle,GripParityRegression,GateBoxGripIsolationRegression,GripContactObserver,GripContactObserverRegression,WorldPlacement,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,DecisionBlackbox,GateLifeJournal,ContextualMotionProbe,ShadowNonInterferenceRegression,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
      - name: Verify coexistence, independent commands, legal physics
        run: |
          java -cp /tmp/zero1170 com.overmind.zero.GateBoxGripIsolationRegression
          java -cp /tmp/zero1170 com.overmind.zero.GripParityRegression
          java -cp /tmp/zero1170 com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/zero1170 com.overmind.zero.SquareGripPuzzle
      - name: Check diagnostic and neural non-interference regressions
        run: |
          for test in GripContactObserverRegression ShadowNonInterferenceRegression ScarcityLab SensorimotorMind; do
            java -cp /tmp/zero1170 com.overmind.zero.$test
          done
      - name: Assemble unchanged-identity Android debug build
        run: gradle --no-daemon assembleDebug
