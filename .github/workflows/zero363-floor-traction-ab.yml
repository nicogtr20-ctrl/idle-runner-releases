name: V363 traction original game physics A/B (NO OTA)
on:
  push:
    branches: [fix/zero363-motor-speed-traction-causal-20261019]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  floor-traction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: python3 tools/zero363_floor_traction_audit.py
