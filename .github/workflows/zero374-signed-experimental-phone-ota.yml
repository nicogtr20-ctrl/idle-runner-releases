name: ZERO374 mixed-source physical attribution OTA, 32 original Android tests
on:
  push:
    branches: [fix/zero374-physical-contact-spectrum-20261020]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zero374-signed-user-test
  cancel-in-progress: false
jobs:
  signed-user-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OVERMIND_BUILD_NUMBER: '185'
      OVERMIND_CANDIDATE_NAME: '3.0-ota.374-test.1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Freeze approved unmerged experimental owner and preserve public stable OTA
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'fix/zero374-physical-contact-spectrum-20261020'
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          main=json.loads(subprocess.check_output(['git','show','origin/main:updater/public/latest.json'],text=True))
          assert main['applicationId']=='com.overmind.zero.ota'
          assert int(main['versionCode'])==1184 and main['versionName']=='3.0-ota.373-test.1', 'Public stable channel changed; do not accidentally downgrade'
          a=Path('app/src/main/java/com/overmind/zero/Zero3OriginalBrainV356.java').read_text()
          b=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          c=Path('app/src/main/java/com/overmind/zero/Zero3MotorPeripheralBridgeV364.java').read_text()
          v=Path('app/src/main/java/com/overmind/zero/Zero3VisionContextV366.java').read_text()
          assert 'Zero3MotorPeripheralBridgeV364' in a
          assert 'symMotor,environment,chamber' in b
          assert 'if(channel==2)continue' in c
          assert 'Zero3VisionContextV361.fromSensory194' in v
          assert Path('app/src/main/java/com/overmind/zero/Zero3VisionContextV367.java').exists()
          assert 'verticalOldContextRiskV367' in Path('app/src/main/java/com/overmind/zero/Zero3ExecutiveV354.java').read_text()
          assert 'genuineTerminal' in a
          assert 'witnessedMaterialMotionV371' in a
          neural=Path('app/src/main/java/com/overmind/zero/Zero3RecurrentBrain.java').read_text()
          cognition=Path('app/src/main/java/com/overmind/zero/Zero3CognitionV353.java').read_text()
          motor=Path('app/src/main/java/com/overmind/zero/SymbioteMotorHeadV1.java').read_text()
          assert 'witnessedMaterialMotionV371' in neural
          assert 'instrumental.contact(' in cognition and 'instrumental.complete(' in cognition
          assert 'Zero3InstrumentalCreditV371.read(d)' in cognition
          assert 'silenceFrozenV3MotorProbeV372' in c
          assert 'fastTickOriginalV370' in motor
          assert 'realMaterialContactV374(' in a and 'realMaterialContactV374(' in b
          assert 'contactValence.materialContact(' in cognition
          assert 'opticalPreferenceV374(' in cognition
          assert 'realContactPreferenceV374(' in neural
          assert 'materialContactV374(' in Path('app/src/main/java/com/overmind/zero/Zero3InstrumentalCreditV371.java').read_text()
          assert Path('app/src/androidTest/java/com/overmind/zero/Zero374RealTouchOpticalIdentityAndroidTest.java').exists()
          assert Path('docs/ZERO30_V366_BLIND_2003_REAL_ANDROID_NEGATIVE_20261019.md').exists()
          print('ZERO374_BETA_ONLY_RETAIN_STABLE_363_AND_V356_LEARNED_WEIGHTS=PASS')
          PY
      - name: Compile original unchanged Android package and regression tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Require all 32 original-world Android technical tests before signing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.overmind.zero.Zero374RealTouchOpticalIdentityAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-contact-source.txt
            grep -q 'OK (5 tests)' /tmp/zero374-contact-source.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero371RealMotorEnergyBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-0.txt
            grep -q 'OK (6 tests)' /tmp/zero374-0.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero372FrozenPeripheralProbeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-1.txt
            grep -q 'OK (2 tests)' /tmp/zero374-1.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero364MotorBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-2.txt
            grep -q 'OK (3 tests)' /tmp/zero374-2.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero370WindSenseIsolationAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-3.txt
            grep -q 'OK (3 tests)' /tmp/zero374-3.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero369LearnedContactValenceAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-4.txt
            grep -q 'OK (4 tests)' /tmp/zero374-4.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero368CausalIntegrationTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-5.txt
            grep -q 'OK (4 tests)' /tmp/zero374-5.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366VisionMemoryAndPlannerTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-6.txt
            grep -q 'OK (5 tests)' /tmp/zero374-6.txt
            echo V374_ALL_27_ANDROID_REGRESSIONS_PASS
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO374-27-original-android-tests
          path: /tmp/zero374-*.txt
      - name: Restore THE SAME stable OTA signing identity (never expose credentials)
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          bundle=os.environ.get('SIGNING_BUNDLE','')
          if not bundle:raise RuntimeError('Original stable certificate unavailable; cannot ship a compatible test APK')
          obj=json.loads(base64.b64decode(bundle,validate=True))
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero374-original-signing.p12'
          key.write_bytes(base64.b64decode(obj['keyStoreBase64'],validate=True));key.chmod(0o600)
          for value in (obj['password'],obj['alias']):print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('OVERMIND_KEYSTORE_FILE='+str(key)+'\n')
              env.write('OVERMIND_KEYSTORE_PASSWORD='+obj['password']+'\n')
              env.write('OVERMIND_KEY_PASSWORD='+obj['password']+'\n')
              env.write('OVERMIND_KEY_ALIAS='+obj['alias']+'\n')
          PY
      - name: Build REAL signed original application as install-over-existing phone test
        run: gradle --no-daemon assembleRelease
      - name: Verify EXACT Android application identity, build 1185, OTA original certificate
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$bt/apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/zero374-cert.txt"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/zero374-package.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          cert=(Path(os.environ['RUNNER_TEMP'])/'zero374-cert.txt').read_text()
          assert 'Number of signers: 1' in cert
          assert 'certificate SHA-256 digest: 45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583' in cert, 'SIGNER CHANGED; WOULD DELETE USER DATA'
          pkg=(Path(os.environ['RUNNER_TEMP'])/'zero374-package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in pkg
          assert "versionCode='1185'" in pkg and "versionName='3.0-ota.374-test.1'" in pkg
          m=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())['elements'][0]
          assert m['versionCode']==1185 and m['versionName']=='3.0-ota.374-test.1'
          print('ZERO374_COMPATIBLE_SAME_SIGNER_SAME_PACKAGE_MONOTONIC_CODE=PASS')
          PY
          sha256sum "$apk"
      - name: Upload signed phone test APK with verifiable binary
        uses: actions/upload-artifact@v4
        with:
          name: OVERMIND-ZERO-3.0-374-TEST-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish IMMUTABLE GitHub pre-release — does NOT change latest OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=overmind-zero-v3.0-ota.374-test.1
          apk=app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/zero374"
          cp "$apk" "$RUNNER_TEMP/zero374/OVERMIND-ZERO-TEST-374.apk"
          cat > "$RUNNER_TEMP/zero374/notes.md" <<'NOTES'
          ZERO 3.0 OTA374 TEST — cod.1185 da cervello V374.
          Stesso certificato Android e package della OTA373; installare
          SOPRA ZERO esistente, NON disinstallare. Salvare uno slot.
          Da vero telefono OTA373: 57 rossi, 3 blu, 26 associazioni
          negative ma zero associazioni positive dirette. Problema nel
          collegamento tra materiale realmente toccato e colore: il vecchio
          software dava il credito alla luce più intensa di tutta la scena,
          oppure scartava contatti con due fonti luminose vicine.
          OTA374 associa l'effetto energetico alla firma OTTICA del
          materiale realmente toccato, senza usare leggi energetiche
          nascoste. Valuta anche il movimento FISICAMENTE ottenuto
          quando il comando GRU porta il corpo nella direzione opposta.
          Blocca planner e vecchie opzioni dal cancellare indizi di
          danno energetico osservati fisicamente. Nessun reset cervello,
          venti o salvataggi, nessun secondo cervello.
          Obbligatori 32 test Android prima di firma e pubblicazione.
          ATTENZIONE: è una OTA sperimentale per il telefono; i test
          autonomi precedenti NON hanno dimostrato ricerca di blu
          o evitamento di rossi, quindi miglioramento non certificato.
                    NOTES
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1;then
            gh release download "$tag" --repo "${{ github.repository }}" -p OVERMIND-ZERO-TEST-374.apk -D "$RUNNER_TEMP/zero374"
            cmp "$apk" "$RUNNER_TEMP/zero374/OVERMIND-ZERO-TEST-374.apk"
          else
            gh release create "$tag" "$RUNNER_TEMP/zero374/OVERMIND-ZERO-TEST-374.apk" \
              --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title 'OVERMIND ZERO 3.0 — V374 TEST per telefono' \
              --notes-file "$RUNNER_TEMP/zero374/notes.md" --prerelease
          fi
      - name: Publish user requested experimental OTA to in-app manifest
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          sha=$(sha256sum "$apk"|awk '{print $1}')
          bytes=$(wc -c < "$apk" | tr -d ' ')
          dest="updater/public/apk/overmind-zero-1185-test-${sha:0:12}.apk"
          cp "$apk" "$RUNNER_TEMP/zero374-original-release.apk"
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('updater/public/latest.json').read_text())
          assert j['applicationId']=='com.overmind.zero.ota'
          assert int(j['versionCode'])==1184 and j['versionName']=='3.0-ota.373-test.1', 'Refuse to overwrite newer public OTA'
          PY
          mkdir -p updater/public/apk
          cp "$RUNNER_TEMP/zero374-original-release.apk" "$dest"
          python3 - "$dest" "$sha" "$bytes" <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          dest,sha,size=sys.argv[1:]
          data={
              'schemaVersion':1,'available':True,
              'applicationId':'com.overmind.zero.ota',
              'versionCode':1185,'versionName':'3.0-ota.374-test.1',
              'apkUrl':'https://overmind-zero-updates.vercel.app/apk/'+Path(dest).name,
              'sha256':sha,'sizeBytes':int(size),
              'notes':'OTA374 TEST: causa energetica da sorgente effettivamente toccata, corpo vero e gestione rischio. 32 Android PASS, autonomia NON CERTIFICATA.',
              'publishedAt':datetime.now(timezone.utc).isoformat()
          }
          Path('updater/public/latest.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          assert Path(dest).stat().st_size==int(size)
          print('OTA374_EXPERIMENTAL_MANIFEST',json.dumps(data,ensure_ascii=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest" updater/public/latest.json
          git commit -m "Publish user-requested ZERO3 V374 signed experimental in-app OTA"
          git push origin HEAD:main
          echo "ZERO374_OTA_PUBLIC_APK=https://overmind-zero-updates.vercel.app/apk/$(basename "$dest")"
          echo "ZERO374_OTA_SIGNED_SHA256=$sha"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero374-original-signing.p12"
