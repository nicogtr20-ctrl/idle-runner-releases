name: ZERO3 V3.38 joint constrained triple BOX and gate ownership
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3JointMultiObjectV338Regression.java'
      - '.github/workflows/zero30-v338-multi-object-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-box-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real collision classes, original and selective test
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError('physical baseline compile missing')
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3ExactFaceTrialV336Regression Zero3JointMultiObjectV338Regression'
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: Original CCD and all 7 masks three boxes and gate
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3JointMultiObjectV338Regression | tee /tmp/v337-multi.log
          grep -q 'V338 JOINT_LAB PASS: 3 boxes' /tmp/v337-multi.log
      - name: No promotion from standalone fixture
        run: echo 'G3_BLOCKED G5_BLOCKED SELECTIVE_PHYSICS_LAB_ONLY NO_MERGE NO_OTA'
