name: ZERO 0.11.6 Square Grip Puzzles and Safe Spawn QA
on:
  push:
    branches: [feature/overmind-v1163-square-grip-puzzles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: 'Invariants: no brain weights, action scoring or uncontrolled rare spawns'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          base=Path('app/src/main/java/com/overmind/zero')
          mind=(base/'SensorimotorMind.java').read_text()
          game=(base/'GameActivity.java').read_text()
          world=(base/'UnknownWorld.java').read_text()
          puzzle=(base/'SquareGripPuzzle.java').read_text()
          snapshot=(base/'GameSceneSnapshot.java').read_text()
          placement=(base/'WorldPlacement.java').read_text()
          assert 'float score=legacyQ+earnedValue+planned[a]*.50f+curiosity+jitter+memoryBias+' in mind
          assert 'float epsilon=Math.max(.09f,.52f/(1+experiences/120f));' in mind
          assert 'chosen=random.nextInt(ACTIONS);explorations++;' in mind
          assert 'sensorMind.contactOutcome(reserve-before,object.signature);' in game
          assert 'if(object.isBox()||object.concealed)continue;' in game
          assert 'if(object.consumed||object.concealed)continue;' in game
          assert 'SquareGripPuzzle.constrain(' in game
          assert 'SquareGripPuzzle.uncover(e,environment)' in game
          assert 'WorldPlacement.spawn(' in game
          assert 'existing' in placement and 'room.overlapsRoom' in placement
          assert 'object.concealed' in game
          assert 'law==4?40f:RARE_ENERGY' in world
          assert 'if(opposing&&held>=2)' in puzzle
          assert 'box.everCollided=true;' in puzzle
          assert 'box.displacementFromSpawn()>=UNCOVER_DISTANCE' in puzzle
          assert 'x.optBoolean("concealed",false)' in snapshot
          for filename in ['MotorBrain.java','ExperienceCredit.java','InstrumentalNavigation.java',
                          'GoalContinuity.java','TemporalWorkingMemory.java',
                          'OnlineBodyLearning.java','EpisodicMemory.java','DecisionBlackbox.java',
                          'ResetDomains.java','SaveSlotStore.java','TelemetryGitHub.java']:
            before=subprocess.check_output(['git','show','452acea667427057f19766ef7ecc1761369a2d8a:app/src/main/java/com/overmind/zero/'+filename])
            after=(base/filename).read_bytes()
            assert before==after,filename+' changed unexpectedly'
          print('ZERO original agent weights/scoring, replay, memory and security unchanged')
          PY
      - name: Compile JVM mechanics, original historical regressions and new physical puzzle tests
        run: |
          mkdir -p /tmp/zero1163
          javac -d /tmp/zero1163 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,SquareGripPuzzle,WorldPlacement,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,DecisionBlackbox,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
          for test in SquareGripPuzzle WorldPlacement UnknownWorld ScarcityLab BehavioralLaboratory InstrumentalNavigation GoalContinuity GateBehaviorMetrics CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics SensorimotorMind ExperienceCredit LearnedSequencePlanner MotorBrain ContactLearning DecisionBrain Morphology OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank DecisionBlackbox; do
            java -cp /tmp/zero1163 com.overmind.zero.$test
          done
      - name: Android compile checks scene serialization and drawing
        run: gradle --no-daemon assembleDebug
