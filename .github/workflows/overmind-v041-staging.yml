name: OVERMIND ZERO v0.4.1 continuity and evidence
on:
  push:
    branches: [feature/overmind-v04-visual-proof]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test simulated physics and sensor-value learning
        run: |
          mkdir -p /tmp/zero-041
          javac -d /tmp/zero-041 app/src/main/java/com/overmind/zero/MotorBrain.java app/src/main/java/com/overmind/zero/UnknownWorld.java app/src/main/java/com/overmind/zero/ContactLearning.java
          java -cp /tmp/zero-041 com.overmind.zero.MotorBrain
          java -cp /tmp/zero-041 com.overmind.zero.UnknownWorld
          java -cp /tmp/zero-041 com.overmind.zero.ContactLearning
      - name: Guard against fake movement and timed creature resets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path("app/src/main/java/com/overmind/zero/GameActivity.java").read_text()
          b=Path("app/src/main/java/com/overmind/zero/UnknownWorld.java").read_text()
          assert "phase>=26f" not in a and "Math.hypot(creature.cx,creature.cy)>520" not in a
          assert "if(phase>=13f)" in a and "extendHabitat();" in a
          assert "if(object.everCollided && !object.countedAsMoved && shift>=12f)" in a
          assert "objects_displaced_v041" in a and "collisions_v041" in a
          assert '.putInt("physical_pushes_v04"' not in a
          assert "if(object.everCollided && !object.countedAsMoved && shift>=12f)" in a
          assert "return newHabitat(episode,0,0)" in b
          print("ZERO-004 regression tests passed: no timer teleport, real displacement counted only after actual position change")
          PY
      - name: Build OTA Android staging app
        run: gradle --no-daemon assembleDebug
