name: ZERO 1164 shadow diagnostics QA
on:
  push:
    branches: [feature/overmind-v1164-gate-shadow-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: JVM regression tests
        run: |
          mkdir -p /tmp/zero1164
          javac -d /tmp/zero1164 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,SquareGripPuzzle,WorldPlacement,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,DecisionBlackbox,GateLifeJournal,ContextualMotionProbe,ShadowNonInterferenceRegression,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
          for test in ShadowNonInterferenceRegression GateLifeJournal ContextualMotionProbe GateBehaviorMetrics SquareGripPuzzle WorldPlacement SensorimotorMind DecisionBlackbox BehavioralLaboratory InstrumentalNavigation GoalContinuity CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics ExperienceCredit LearnedSequencePlanner MotorBrain UnknownWorld ScarcityLab ContactLearning DecisionBrain Morphology OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank; do
            java -cp /tmp/zero1164 com.overmind.zero.$test
          done
      - name: Android build
        run: gradle --no-daemon assembleDebug
