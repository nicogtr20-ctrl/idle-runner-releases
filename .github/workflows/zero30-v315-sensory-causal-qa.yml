name: ZERO3 V3.15 immutable 96-patch sensory causal experience QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3SensoryFrameV315.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CausalRecorderV315.java'
      - 'app/src/main/java/com/overmind/zero/Zero3SensoryContractV315Regression.java'
      - '.github/workflows/zero30-v315-sensory-causal-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-physical-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual production physics/sensory sources and V3.15 independent contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          s=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',s,re.M)
          if m is None:raise RuntimeError('Official production Java source list missing')
          root='app/src/main/java/com/overmind/zero/'
          extras=['Zero3LearningFoundation.java',
            'Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java',
            'Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
            'Zero3SensoryFrameV315.java',
            'Zero3CausalRecorderV315.java',
            'Zero3SensoryContractV315Regression.java']
          subprocess.run(shlex.split(m.group(1))+[root+n for n in extras],check=True)
          PY
      - name: Verify immutable real frame 96x12 and at least 2048 causal gel decisions
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3SensoryContractV315Regression | tee /tmp/zero315.txt
          grep -q 'realRecordedDecisions=2048' /tmp/zero315.txt
          grep -q 'solverSteps=3584' /tmp/zero315.txt
          grep -q 'ZERO3 V315 GATE=PASS' /tmp/zero315.txt
          grep -q 'autonomousLearning=false G3_BLOCKED G5_BLOCKED NO_OTA' /tmp/zero315.txt
