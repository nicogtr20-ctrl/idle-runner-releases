name: ZERO 0.11.6 Optical Cues and Glass Window QA
on:
  push:
    branches: [feature/overmind-v1165-optical-cues]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify no physical laws, action choices, learning or save formats changed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('app/src/main/java/com/overmind/zero')
          untouched=['ScarcityLab.java','SquareGripPuzzle.java','UnknownWorld.java',
            'MotorBrain.java','Morphology.java','ExperienceCredit.java',
            'InstrumentalNavigation.java','DecisionBrain.java','GoalContinuity.java',
            'ContextualMotionProbe.java','GateLifeJournal.java','DecisionBlackbox.java',
            'GameSceneSnapshot.java','SaveSlotStore.java','ResetDomains.java',
            'WorldPlacement.java','TelemetryGitHub.java','ContactLearning.java']
          for name in untouched:
            before=subprocess.check_output(['git','show',
              '233a5072dbd2213b300251976c81fc5994685327:app/src/main/java/com/overmind/zero/'+name])
            assert before==(p/name).read_bytes(),name+' unexpectedly changed'
          mind=(p/'SensorimotorMind.java').read_text()
          game=(p/'GameActivity.java').read_text()
          optics=(p/'OpticalCues.java').read_text()
          assert 'public static final int S=26;' in mind
          assert 'public static final int ACTIONS=16;' in mind
          assert 'float epsilon=Math.max(.09f,.52f/(1+experiences/120f));' in mind
          assert 'if(score>best){best=score;chosen=a;}' in mind
          assert 'chosen=random.nextInt(ACTIONS);explorations++;' in mind
          assert 'OpticalCues.coverOf' in mind and 'OpticalCues.frontWindow' in mind
          assert 'transparentGlass' in mind and 'boolean cueEnabled' in mind
          assert 'leakBrightness' in optics and 'LEAK_POWER=.20f' in optics
          assert 'OpticalCues.GLASS_TOP' in game
          assert 'concealedLight' in game
          assert 'SquareGripPuzzle.constrain(' in game
          assert 'SquareGripPuzzle.uncover(e,environment)' in game
          assert 'GateLifeJournal.LAST,gateJournal.lastLife()' in game
          print('Optical-only: signed 11.6 cognition, all collision physics, previous saves and privacy unchanged')
          PY
      - name: Optical photon/collision experiments and all historical JVM tests
        run: |
          mkdir -p /tmp/zero1165
          javac -d /tmp/zero1165 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,OpticalCues,OpticalCueRegression,SquareGripPuzzle,WorldPlacement,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,DecisionBlackbox,GateLifeJournal,ContextualMotionProbe,ShadowNonInterferenceRegression,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
          for test in OpticalCues OpticalCueRegression ShadowNonInterferenceRegression GateLifeJournal ContextualMotionProbe GateBehaviorMetrics SquareGripPuzzle WorldPlacement SensorimotorMind DecisionBlackbox BehavioralLaboratory InstrumentalNavigation GoalContinuity CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics ExperienceCredit LearnedSequencePlanner MotorBrain UnknownWorld ScarcityLab ContactLearning DecisionBrain Morphology OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank; do
            java -cp /tmp/zero1165 com.overmind.zero.$test
          done
      - name: Android debug compile (no distribution)
        run: gradle --no-daemon assembleDebug
