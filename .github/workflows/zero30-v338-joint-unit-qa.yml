name: ZERO3 V3.38 transactional joint constraint unit and physical contract
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3JointBoxConstraintV338.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointConstraintV338Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - '.github/workflows/zero30-v338-joint-unit-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile true ZERO gel and box physics with isolated V338 classes
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError('real Java compiler source list missing')
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3JointConstraintV338Regression Zero3ExactFaceTrialV336Regression Zero3SelectiveMultiObjectV337Regression'
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: Immutable legal state and joint constrained repair or transactional failure
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3JointConstraintV338Regression | tee /tmp/joint.log
          grep -q 'V338 JOINT_UNIT PASS' /tmp/joint.log
      - name: Preserve original and true three-object grip mechanics
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/overmind com.overmind.zero.SquareGripPuzzle
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -cp /tmp/overmind com.overmind.zero.Zero3SelectiveMultiObjectV337Regression
      - name: No G3 or OTA promotion
        run: echo 'V338_ISOLATED_EXPERIMENT_ONLY NO_OTA G3_BLOCKED G5_BLOCKED'
