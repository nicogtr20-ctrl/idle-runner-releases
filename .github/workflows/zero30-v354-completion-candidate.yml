name: ZERO3 V354 integrated candidate core and Android UI
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'tools/zero3_core_qa.py'
      - 'tools/fixtures/**'
      - '.github/workflows/zero30-v354-completion-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-core:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Full real organism, observer freeze, profile integrity, joint contact and 10000-decision cold restart
        run: python3 tools/zero3_core_qa.py --variable-clock --cognitive --completion --long-life 10000
      - name: Android candidate compile, no stable publisher
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero3-v354-candidate-build
          path: app/build/outputs/apk/debug/*.apk
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Activity, real neural data, observe mode and all V3 pages (API35 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.overmind.zero.ota/files/qa /tmp/zero354-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero3-v354-real-ui-and-results
          path: |
            /tmp/zero354-ui
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
