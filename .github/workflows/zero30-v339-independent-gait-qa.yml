name: ZERO3 V3.39 TRUE closed-loop FULL OLD FROZEN 32train 24blind
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3AutonomousGaitV339Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointBoxConstraintV338.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointWorldV339.java'
      - 'app/src/main/java/com/overmind/zero/Zero3AutonomousGaitV339Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ContactTopologyExperimentV336.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - '.github/workflows/zero30-v339-independent-gait-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-actuated:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production gel and real neural sensorimotor pipeline
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError("original production Java physical compile list absent")
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3JointWorldV339 Zero3ExactFaceTrialV336Regression Zero3ActuatedContactStressV336Regression Zero3AutonomousGaitV339Regression'
          subprocess.run(shlex.split(m.group(1))+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: True 3-arm recurrent autonomous training and blind physical evaluation
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3AutonomousGaitV339Regression | tee /tmp/v339-gait.log
          grep -q 'V339 SCIENCE_FINAL G3=' /tmp/v339-gait.log
          test "$(grep -c 'V339 FAMILY_GATE family=' /tmp/v339-gait.log)" -eq 4
          test "$(grep -c 'V339 BLIND_TOTAL arm=' /tmp/v339-gait.log)" -eq 3
          grep -q 'V339 CORTEX_RESTART arm=FULL_LOCAL_DELAY weightBitsEqual=true' /tmp/v339-gait.log
          grep -q 'independentClosedLoopArms=true G5_BLOCKED NO_OTA NO_MERGE' /tmp/v339-gait.log
      - name: Original physical grip / three object isolation after research
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -cp /tmp/overmind com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/overmind com.overmind.zero.SquareGripPuzzle
      - name: Build Android Debug but never publish OTA
        run: gradle --no-daemon assembleDebug
      - name: Keep candidate and learning gates blocked
        run: echo 'V339_AUTONOMOUS_3ARM_NEVER_PROMOTE_ON_CI_ALONE G3_BLOCKED G5_BLOCKED NO_OTA NO_MERGE'
