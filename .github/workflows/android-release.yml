name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish download
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Aurora-Dash-v0.3.apk
          TAG="v0.3.\${{ github.run_number }}"
          gh release create "$TAG" Aurora-Dash-v0.3.apk --title "Aurora Dash $TAG" --notes "Test APK: larger coins, faster parallax, smooth animation, variable-height jumping and reliable double jump." --target "\${{ github.sha }}"
