name: OVERMIND ZERO brain APK
on:
  push:
    branches: [experiment/overmind-zero-brain-v02]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test virgin motor brain and learning
        run: |
          mkdir -p /tmp/zero-001-test
          javac -d /tmp/zero-001-test app/src/main/java/com/overmind/zero/MotorBrain.java
          java -cp /tmp/zero-001-test com.overmind.zero.MotorBrain
      - name: Build Android APK
        run: gradle --no-daemon assembleDebug
      - name: Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OVERMIND-ZERO-BRAIN-v0.2.apk
          TAG="zero-brain-v0.2.${{ github.run_number }}"
          gh release create "$TAG" OVERMIND-ZERO-BRAIN-v0.2.apk --title "OVERMIND: ZERO Brain $TAG" --notes "ZERO-001: Android experiment with randomly initialized neural motor controller, a physics-based liquid organism, trial-and-error learning, persistence, and holdout benchmarking. NOT an AGI or general world model." --target "${{ github.sha }}"
