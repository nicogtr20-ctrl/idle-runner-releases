name: ZERO 0.11.5 Damage Recovery and Multi-Hazard Physical QA
on:
  push:
    branches: [feature/overmind-v115-consequence-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Physically validate 30 paired scenarios, recovery and all previous memories
        run: |
          mkdir -p /tmp/zero115
          javac -d /tmp/zero115 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,AdaptiveSafety,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
          for test in AdaptiveSafety BehavioralLaboratory InstrumentalNavigation GoalContinuity GateBehaviorMetrics CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics SensorimotorMind ExperienceCredit LearnedSequencePlanner MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank; do
            java -cp /tmp/zero115 com.overmind.zero.$test
          done
      - name: Audit response to real physical damage, choice, and profile safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d=Path('app/src/main/java/com/overmind/zero')
          brain=(d/'SensorimotorMind.java').read_text()
          nav=(d/'InstrumentalNavigation.java').read_text()
          recovery=(d/'AdaptiveSafety.java').read_text()
          game=(d/'GameActivity.java').read_text()
          lab=(d/'BehavioralLaboratory.java').read_text()
          activity=(d/'BehavioralLabActivity.java').read_text()
          panel=(d/'BrainToolsActivity.java').read_text()
          resets=(d/'ResetDomains.java').read_text()
          slots=(d/'SaveSlotStore.java').read_text()
          gradle=Path('app/build.gradle').read_text()
          assert 'safety.contact(actualEnergyDelta,visuallyObservedSignature,navigation)' in brain
          assert 'navigation.energyOutcome(actualEnergyDelta,' in brain
          assert 'boolean earlyPain=actualEnergySinceChoice<-.01f&&elapsed>=.18f;' in brain
          assert 'learning&&!holdout&&!earlyPain,holdout&&!earlyPain' in brain
          assert 'safety.bias(navigation,a)' in brain
          assert 'scores[a]>=best-.75f' in brain
          assert 'navigationAdviceEnabled=true' in brain
          assert 'lastReward=energyOutcome+' in brain
          assert 'public static final int S=26;' in brain
          assert 'public float learnedHarmExposure(int action)' in nav
          assert 'effects[signal]<1||valence[signal]>-.12f' in nav
          assert 'actualEnergyDelta>=-.01f' in recovery
          assert 'nav.signalValue(wavelength)>=-.08f' in recovery
          assert 'return clamp(-.95f*urgency*exposure,-.95f,.95f)' in recovery
          assert 'realDisplacement>=3&&lastChange>.012f' in recovery
          assert '.putString(AdaptiveSafety.KEY,adaptiveSafety.encode())' in game
          assert 'adaptiveSafety.restore(prefs.getString(AdaptiveSafety.KEY,""))' in game
          assert 'sensorMind.attachAdaptiveSafety(adaptiveSafety)' in game
          for key in ['InstrumentalNavigation.KEY','GoalContinuity.KEY','GateBehaviorMetrics.KEY','CausalExperiments.KEY','SpatialPerception.KEY','BodyProprioception.KEY','LifeStatistics.KEY']:
            assert '.putString('+key+',' in game
          for key in ['"episodic_memory_v095"','"temporal_working_memory_v106"','"temporal_skills_v107"']:
            assert '.putString('+key+',' in game
          assert 'ENERGY=0,HARM=1,GATE=2,CLUSTER=3,CHOICE=4,CASES=5,SEEDS=3' in lab
          assert 'brain.attachAdaptiveSafety(danger)' in lab
          assert 'r.damageFollowingDamage++' in lab
          assert 'r.threatEscapes++' in lab
          assert 'r.smallSteps++' in lab
          assert 'r.gateDiagnostics.observe(body,room)' in lab
          assert 'body.step(input.motor,mx,my,DT,input.hands,px,py)' in lab
          assert 'surface.step(body,input.membrane,px,py,DT,brain.adhesion())' in lab
          assert 'brain.contactOutcome(delta,object.signature)' in lab
          assert 'brain.setNavigationAdviceEnabled(instrument)' in lab
          assert 'p.safety=prefs.getString(AdaptiveSafety.KEY,"")' in activity
          assert 'getSharedPreferences("zero_motorbrain_001",MODE_PRIVATE).edit()' not in activity
          assert 'AdaptiveSafety.KEY' in panel and 'ResetDomains.SAFETY' in panel
          assert 'case SAFETY:return new String[]{AdaptiveSafety.KEY};' in resets
          assert 'SaveProfileCodec.encode(capture())' in slots and 'SLOTS=12' in slots
          assert '0.11.5-ota' in gradle and "applicationId 'com.overmind.zero.ota'" in gradle
          print('ZERO-0115 physical hazard cluster and mixed choice A/B, energy loss-driven earned safety, no scene info to policy, 12 slots intact')
          PY
      - name: Compile Android signed-updater-compatible debug app
        run: gradle --no-daemon assembleDebug
