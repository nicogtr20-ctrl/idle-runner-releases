name: ZERO3 V3.10 local single-frame biomechanics QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3MotorLocalFrameV310Regression.java'
      - '.github/workflows/zero30-motor-local-v310-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-real-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real material solver and isolated local per-frame model
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib, re, shlex, subprocess
          p=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',p,re.M)
          if m is None:
              raise RuntimeError('Missing verified production body source list')
          files=[
            'Zero3LearningFoundation.java',
            'Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java',
            'Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLongHorizonRegression.java',
            'Zero3MotorTemporalHistoryRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
          ]
          root='app/src/main/java/com/overmind/zero/'
          subprocess.run(shlex.split(m.group(1))+[root+f for f in files],check=True)
          PY
      - name: Compare 16 sector morphology and actual 64 muscle inputs, per-frame and long rollouts
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3MotorLocalFrameV310Regression | tee /tmp/zero310.txt
          grep -q 'ZERO3 V310 FINAL' /tmp/zero310.txt
          grep -q 'futureStatesLeak=false' /tmp/zero310.txt
          grep -q 'NO_OTA' /tmp/zero310.txt
