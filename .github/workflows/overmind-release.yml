name: OVERMIND ZERO APK
on:
  push:
    branches:
      - experiment/overmind-zero-v01
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OVERMIND-ZERO-v0.1.apk
          TAG="overmind-v0.1.${{ github.run_number }}"
          gh release create "$TAG" OVERMIND-ZERO-v0.1.apk --title "OVERMIND ZERO $TAG" --notes "Android prototype: autonomous learning, black symbiote, exploration, energy, research, colony, XP economy and god interventions." --target "${{ github.sha }}"
