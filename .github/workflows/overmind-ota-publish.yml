name: OVERMIND stable OTA publisher
on:
  push:
    branches: [feature/overmind-inapp-updater]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: |
          mkdir -p /tmp/overmind
          javac -d /tmp/overmind app/src/main/java/com/overmind/zero/MotorBrain.java app/src/main/java/com/overmind/zero/UnknownWorld.java
          java -cp /tmp/overmind com.overmind.zero.MotorBrain
          java -cp /tmp/overmind com.overmind.zero.UnknownWorld
      - name: Compile OTA client
        run: gradle --no-daemon assembleDebug
      - name: Validate signing secrets
        env:
          KEYSTORE_DATA: ${{ secrets.OVERMIND_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OVERMIND_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OVERMIND_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OVERMIND_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_DATA" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Stable signing not configured: APK compiled, publication BLOCKED."
            echo "signing_ready=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$KEYSTORE_DATA" | base64 -d > "$RUNNER_TEMP/overmind.jks"
            chmod 600 "$RUNNER_TEMP/overmind.jks"
            echo "OVERMIND_KEYSTORE_FILE=$RUNNER_TEMP/overmind.jks" >> "$GITHUB_ENV"
            echo "signing_ready=true" >> "$GITHUB_ENV"
          fi
      - name: Assemble stable signed APK
        if: env.signing_ready == 'true'
        env:
          OVERMIND_KEYSTORE_PASSWORD: ${{ secrets.OVERMIND_KEYSTORE_PASSWORD }}
          OVERMIND_KEY_ALIAS: ${{ secrets.OVERMIND_KEY_ALIAS }}
          OVERMIND_KEY_PASSWORD: ${{ secrets.OVERMIND_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish signed APK to updater in main
        if: env.signing_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/signed-update.apk"
          VERSION_CODE=$(grep -E 'versionCode [0-9]+' app/build.gradle | head -1 | awk '{print $2}')
          VERSION_NAME=$(grep 'versionName ' app/build.gradle | head -1 | sed -E "s/.*versionName '([^']+)'.*/\1/")
          APK_SHA=$(sha256sum "$RUNNER_TEMP/signed-update.apk" | awk '{print $1}')
          APK_SIZE=$(wc -c < "$RUNNER_TEMP/signed-update.apk" | tr -d ' ')
          git fetch origin main
          git checkout main
          mkdir -p updater/public/apk
          APK_FILENAME="overmind-zero-$VERSION_CODE.apk"
          cp "$RUNNER_TEMP/signed-update.apk" "updater/public/apk/$APK_FILENAME"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_FILENAME" "$APK_SHA" "$APK_SIZE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          vc, vn, filename, sha, size = sys.argv[1:]
          metadata={
            "schemaVersion":1,"available":True,
            "applicationId":"com.overmind.zero.ota",
            "versionCode":int(vc),"versionName":vn,
            "apkUrl":"https://overmind-zero-updates.vercel.app/apk/"+filename,
            "sha256":sha,"sizeBytes":int(size),
            "notes":"Aggiornamento OVERMIND ZERO verificato e firmato",
            "publishedAt":datetime.now(timezone.utc).isoformat()
          }
          with open("updater/public/latest.json","w",encoding="utf-8") as f:
            json.dump(metadata,f,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/public/latest.json updater/public/apk/
          git diff --cached --quiet && exit 0
          git commit -m "Publish signed OVERMIND $VERSION_NAME OTA build"
          git push origin main
          echo "Signed APK committed to Vercel-linked branch main."
