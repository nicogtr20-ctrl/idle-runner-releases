      - name: Assemble stable signed APK
        if: env.signing_ready == 'true'
        run: gradle --no-daemon assembleRelease
      - name: Verify updater permissions and APK provider in signed manifest
        if: env.signing_ready == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -F "android.permission.INTERNET" "$RUNNER_TEMP/permissions.txt"
          grep -F "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/permissions.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F "com.overmind.zero.UpdateFileProvider" "$RUNNER_TEMP/manifest.txt"
          grep -F "com.overmind.zero.ota.updates" "$RUNNER_TEMP/manifest.txt"
          echo "Validated final signed APK: network, installer permission and update provider."
      - name: Create verified GitHub Release BEFORE updating public OTA manifest
        if: env.signing_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          VERSION_NAME=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          VERSION_CODE=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          TAG="overmind-zero-v$VERSION_NAME"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(wc -c < "$APK" | tr -d ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Signed GitHub Release exists: $TAG"
          else
            cp "$APK" OVERMIND-ZERO.apk
            cat > "$RUNNER_TEMP/overmind-release-notes.md" <<NOTES
          OVERMIND ZERO $VERSION_NAME (versionCode $VERSION_CODE)

          APK originale firmata con la chiave stabile dell'app com.overmind.zero.ota.
          SHA-256: $SHA. Dimensione: $SIZE byte.

          Puoi installare sopra la versione attuale senza disinstallare. I salvataggi con nome restano intatti.
          La release GitHub offre il percorso di riserva quando Vercel è obsoleto o non raggiungibile.
          NOTES
            gh release create "$TAG" OVERMIND-ZERO.apk --repo "${{ github.repository }}" \
              --title "OVERMIND ZERO $VERSION_NAME" \
              --notes-file "$RUNNER_TEMP/overmind-release-notes.md" \
              --target "${{ github.sha }}"
          fi
          echo "Verified immutable fallback release ready BEFORE raw GitHub manifest changes."
      - name: Publish signed APK to updater in main
        if: env.signing_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/signed-update.apk"
          VERSION_CODE=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          VERSION_NAME=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          APK_SHA=$(sha256sum "$RUNNER_TEMP/signed-update.apk" | awk '{print $1}')
          APK_SIZE=$(wc -c < "$RUNNER_TEMP/signed-update.apk" | tr -d ' ')
          git fetch origin main
          git checkout main
          mkdir -p updater/public/apk
          APK_FILENAME="overmind-zero-$VERSION_CODE-${APK_SHA:0:12}.apk"
          cp "$RUNNER_TEMP/signed-update.apk" "updater/public/apk/$APK_FILENAME"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_FILENAME" "$APK_SHA" "$APK_SIZE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          vc, vn, filename, sha, size = sys.argv[1:]
          metadata={
            "schemaVersion":1,"available":True,
            "applicationId":"com.overmind.zero.ota",
            "versionCode":int(vc),"versionName":vn,
            "apkUrl":"https://overmind-zero-updates.vercel.app/apk/"+filename,
            "sha256":sha,"sizeBytes":int(size),
            "notes":"Aggiornamento OVERMIND ZERO verificato e firmato",
            "publishedAt":datetime.now(timezone.utc).isoformat()
          }
          with open("updater/public/latest.json","w",encoding="utf-8") as f:
            json.dump(metadata,f,indent=2)
          with open("docs/CHANGELOG.md","a",encoding="utf-8") as f:
            f.write("\n## OTA "+vn+" — "+metadata["publishedAt"]+"\n")
            f.write("- Pacchetto Android firmato pubblicato su Vercel (codice "+vc+").\n")
            f.write("- SHA-256: `"+sha+"`.\n")
            f.write("- APK: `/apk/"+filename+"`.\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/public/latest.json updater/public/apk/ docs/CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish signed OVERMIND $VERSION_NAME OTA build"
          git push origin main
          echo "Signed APK committed to Vercel-linked branch main."
