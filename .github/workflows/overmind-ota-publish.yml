name: OVERMIND stable OTA publisher
# 0.9.9 retry after parallel paper commits changed main during first publish attempt.
on:
  push:
    branches: [feature/overmind-inapp-updater]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: overmind-ota-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVERMIND_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: |
          mkdir -p /tmp/overmind
          javac -d /tmp/overmind app/src/main/java/com/overmind/zero/MotorBrain.java app/src/main/java/com/overmind/zero/UnknownWorld.java app/src/main/java/com/overmind/zero/ContactLearning.java app/src/main/java/com/overmind/zero/DecisionBrain.java app/src/main/java/com/overmind/zero/Morphology.java app/src/main/java/com/overmind/zero/ScarcityLab.java app/src/main/java/com/overmind/zero/SensorimotorMind.java app/src/main/java/com/overmind/zero/LearnedSequencePlanner.java app/src/main/java/com/overmind/zero/LearningDiagnostics.java app/src/main/java/com/overmind/zero/ResetDomains.java app/src/main/java/com/overmind/zero/OnlineBodyLearning.java app/src/main/java/com/overmind/zero/MotionExploration.java app/src/main/java/com/overmind/zero/EpisodicMemory.java app/src/main/java/com/overmind/zero/MotorAutonomyGuard.java app/src/main/java/com/overmind/zero/MotorSkillBank.java app/src/main/java/com/overmind/zero/ExperienceCredit.java app/src/main/java/com/overmind/zero/GripSkillBank.java app/src/main/java/com/overmind/zero/SaveProfileCodec.java
          java -cp /tmp/overmind com.overmind.zero.MotorBrain
          java -cp /tmp/overmind com.overmind.zero.UnknownWorld
          java -cp /tmp/overmind com.overmind.zero.ContactLearning
          java -cp /tmp/overmind com.overmind.zero.DecisionBrain
          java -cp /tmp/overmind com.overmind.zero.Morphology
          java -cp /tmp/overmind com.overmind.zero.ScarcityLab
          java -cp /tmp/overmind com.overmind.zero.SensorimotorMind
          java -cp /tmp/overmind com.overmind.zero.LearnedSequencePlanner
          java -cp /tmp/overmind com.overmind.zero.LearningDiagnostics
          java -cp /tmp/overmind com.overmind.zero.ResetDomains
          java -cp /tmp/overmind com.overmind.zero.OnlineBodyLearning
          java -cp /tmp/overmind com.overmind.zero.MotionExploration
          java -cp /tmp/overmind com.overmind.zero.EpisodicMemory
          java -cp /tmp/overmind com.overmind.zero.MotorAutonomyGuard
          java -cp /tmp/overmind com.overmind.zero.MotorSkillBank
          java -cp /tmp/overmind com.overmind.zero.GripSkillBank
          java -cp /tmp/overmind com.overmind.zero.ExperienceCredit
          java -cp /tmp/overmind com.overmind.zero.SaveProfileCodec
          # v0.6 includes v0.5 -> v0.6 weight migration and expansion invariants.
      - name: Confirm trained selection replaced scripted selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/overmind/zero/GameActivity.java").read_text()
          assert "decisionBrain.choose(environment" not in s
          assert "sensorMind.observe(SensorimotorMind.Senses.read(" in s
          assert "float mx=sensorMind.motorX(),my=sensorMind.motorY();" in s
          assert "mind.choose(environment" not in s
          assert 'putString("decision_brain_v05"' in s
          assert 'decisionBrain.learn(object,before,reserve,0)' in s
          print("ZERO self-selects movement using actual online sensorimotor feedback")
          PY
      - name: Verify evolving brain and in-app skill sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          ui=Path('app/src/main/java/com/overmind/zero/BrainStatsActivity.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          brain=Path('app/src/main/java/com/overmind/zero/DecisionBrain.java').read_text()
          assert 'BrainStatsActivity.class' in game
          assert 'android:name="com.overmind.zero.BrainStatsActivity"' in manifest
          assert 'initialSnapshot()' in ui and 'snapshot()' in ui
          assert 'PARAMETRI' in ui and 'EVOLUZIONE' in ui and 'ABILITA' in ui
          assert 'decision_brain_v05' in game and 'hand_brain_v04' in game
          assert 'growthAttempts' in brain and 'growthAccepted' in brain
          assert 'if(parts.length>0&&"v1".equals(parts[0]))' in brain
          print('ZERO-006 signed release gate passed: migration, real weight sheet, growth')
          PY
      - name: Verify 96-point physical grip and finite supplies in signed APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          brain=Path('app/src/main/java/com/overmind/zero/Morphology.java').read_text()
          page=Path('app/src/main/java/com/overmind/zero/BrainStatsActivity.java').read_text()
          assert 'public static final int POINTS=96;' in brain
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in app
          assert 'lastAppliedMembrane=liveBody.weights(2,shapeTrainer.best);' in app
          assert 'lastAppliedHand=liveBody.weights(1,handTrainer.best);' in app
          assert 'episodic.weights(' not in app
          assert 'recalledManipulationInAction' not in app
          assert 'motorGuard.observe(slice,creature.cx,creature.cy,newlyMeasuredEffect);' in app
          assert 'surface.step(creature,lastAppliedMembrane,px,py,slice,' in app
          assert 'Morphology.collide(surface,object,dt)' in app
          assert 'float[] xx=surface.x, yy=surface.y;' in app
          assert 'morph_brain_v07' in app and 'decision_brain_v05' in app
          assert 'hand_brain_v04' in app and 'putString("best"' in app
          assert '"MEMBRANA"' in page
          world=Path('app/src/main/java/com/overmind/zero/UnknownWorld.java').read_text()
          chamber=Path('app/src/main/java/com/overmind/zero/ScarcityLab.java').read_text()
          assert 'chamber.constrain(creature,surface,slice,sensorMind.adhesion());' in app
          assert 'foodTouchedByCore(creature)' in app
          assert 'consumed=true;cooldown=Float.POSITIVE_INFINITY' in world
          assert 'leftGrip>0&&rightGrip>0' in chamber
          assert 'dualTouchNoGrip' in chamber and 'Morphology.GRIP_HOLD' in chamber
          assert 'out[2]+gripDrive*touchSense[i]' in brain
          assert 'public static float[] migrate' in brain
          assert 'shapeTrainer.attemptGate(trainer.best,handTrainer.best)' not in app
          assert 'sensorimotor_model_v09' in app
          assert 'room_success_v08' in app and 'grip_events_v08' in app
          print('ZERO-008: physical 96-point membrane, finite energy, bilateral grip, room tests and old brain persistence passed')
          PY
      - name: Verify active grip, backward compatible brain and life continuity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/overmind/zero/Morphology.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/ScarcityLab.java').read_text()
          a=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          assert 'GRIP_HEAD=HIDDEN+2' in m
          assert 'out[2]+gripDrive*touchSense[i]' in m
          assert 'grab+=touch*w[LEGACY_PARAMS+HIDDEN+1]' in m
          assert 'if(chamber!=null&&surface.gripHold[i]>=Morphology.GRIP_HOLD)' in a
          assert 'dualTouchNoGrip' in s and 'leftGrip>0&&rightGrip>0' in s
          assert 'decision_brain_v05' in a and 'morph_brain_v07' in a
          assert 'if(reserve<=0)' in a and 'resetEpisode();' in a
          print('Only actively commanding adhesive patches can drag gate; 74 learned weights preserved.')
          PY
      - name: Verify forward-model driven autonomy and unchanged death
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          m=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          ui=Path('app/src/main/java/com/overmind/zero/BrainStatsActivity.java').read_text()
          assert 'sensorimotor_model_v09' in a and 'sensorMind.observe(' in a
          assert 'Math.atan2(chosenObject.y' not in a and 'decisionBrain.choose(environment' not in a
          assert 'sensorMind.adhesion()' in a
          assert 'sensorMind.setLearning(true);' in a and 'learning=!learning' not in a
          assert 'if(reserve<=0)' in a and 'resetEpisode();' in a
          assert 'shapeTrainer.attemptGate(trainer.best,handTrainer.best)' not in a
          assert 'contactCredit.value(senses,a)' in m and 'contactCredit.displaced(physicalEffect)' in m
          assert 'model[base+j]' in m and 'value[base+k]' in m
          assert 'worldMind.restore(' in ui
          assert 'morph_brain_v07' in a and 'decision_brain_v05' in a
          print('ZERO-009 gates: no goal oracle, online sensory learning, old memory and mortal life preserved.')
          PY
      - name: Verify net exploration, persistent per-skill trial tracking and real comparison UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          b=Path('app/src/main/java/com/overmind/zero/OnlineBodyLearning.java').read_text()
          j=Path('app/src/main/java/com/overmind/zero/MotionExploration.java').read_text()
          t=Path('app/src/main/java/com/overmind/zero/BrainToolsActivity.java').read_text()
          r=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          assert 'journey.observe(creature.cx,creature.cy,energyBeforeFrame,reserve)' in a
          assert 'NETTO ' in a and 'ZONE ' in a and 'showBenchmark=true' in a
          assert 'lastBaselineScore' in a and 'lastCandidateScore' in a
          assert 'useful=net>baseNet+1.5f' in b and 'energySpent' in b
          assert 'MAX_CELLS_PER_LIFE' in j and 'lifeCells' in j
          for domain in ('motor','hand','membrane'):
            assert 'online_accepted_'+domain+'_v094' in a
            assert 'online_rejected_'+domain+'_v094' in r
          assert 'ADATTAMENTO CORPOREO REALE' in t
          print('ZERO-009.4: real net exploration, efficiency, safe domain resets and truthful test overlay passed')
          PY
      - name: Compile OTA client
        run: gradle --no-daemon assembleDebug
      - name: Restore private signing bundle
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo "Signing bundle has not been configured: compile verified, publishing disabled."
            echo "signing_ready=false" >> "$GITHUB_ENV"
          else
            printf '%s' "$SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/overmind-signing.json"
            python3 - <<'PY'
          import json, base64, os, pathlib
          src=pathlib.Path(os.environ["RUNNER_TEMP"])/"overmind-signing.json"
          obj=json.loads(src.read_text("utf-8"))
          key=pathlib.Path(os.environ["RUNNER_TEMP"])/"overmind-release.p12"
          key.write_bytes(base64.b64decode(obj["keyStoreBase64"],validate=True))
          key.chmod(0o600)
          pwd=obj["password"]
          alias=obj["alias"]
          for value in [pwd,alias]:print("::add-mask::"+value)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
            fh.write("OVERMIND_KEYSTORE_FILE="+str(key)+"\n")
            fh.write("OVERMIND_KEYSTORE_PASSWORD="+pwd+"\n")
            fh.write("OVERMIND_KEY_PASSWORD="+pwd+"\n")
            fh.write("OVERMIND_KEY_ALIAS="+alias+"\n")
            fh.write("signing_ready=true\n")
          src.unlink()
          PY
          fi
      - name: Test release signing with temporary CI certificate
        if: env.signing_ready != 'true'
        run: |
          keytool -genkeypair -noprompt -alias overmindtest -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 -keystore "$RUNNER_TEMP/disposable.p12" -storepass NeverShipThisTestKey1 -keypass NeverShipThisTestKey1 -dname "CN=Disposable CI Test"
          OVERMIND_KEYSTORE_FILE="$RUNNER_TEMP/disposable.p12" OVERMIND_KEYSTORE_PASSWORD="NeverShipThisTestKey1" OVERMIND_KEY_ALIAS="overmindtest" OVERMIND_KEY_PASSWORD="NeverShipThisTestKey1" gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          echo "Release-signing path compiled with DISPOSABLE key. APK NOT published."
      - name: Ensure positive/negative memory and v0.9.5 migration in signed APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e=Path('app/src/main/java/com/overmind/zero/EpisodicMemory.java').read_text()
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          p=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          t=Path('app/src/main/java/com/overmind/zero/BrainToolsActivity.java').read_text()
          assert 'DEPTH=36,MAX_EPISODES=24' in e
          assert 'raw.startsWith("em1;")' in e and 'raw.startsWith("em2;")' in e and 'raw.startsWith("em3;")' in e
          assert 'e.confirmed' in e and 'if(e.harmful())' in e
          assert 'eventEnergyDeltaSinceAction+=reserve-before' in g
          assert 'eventEnergyDeltaSinceAction<0' in g
          assert 'episodic.consequenceSeparated(' in g and 'energySinceAction' in g
          assert 'episodic_memory_v095' in g
          assert 'episodic.bias(a,proposed)' in p
          assert 'Esperienze dannose' in t
          assert 'trainer.attempt()' not in g
          print('Signed ZERO 0.9.6: memory valence, storage migration and autonomy verified')
          PY
      - name: Prevent learned-motor regression and recalled-action training starvation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          e=Path('app/src/main/java/com/overmind/zero/EpisodicMemory.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          t=Path('app/src/main/java/com/overmind/zero/BrainToolsActivity.java').read_text()
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in g
          assert 'episodic.weights(0' not in g
          assert 'lastAppliedHand=liveBody.weights(1,handTrainer.best);' in g
          assert 'lastAppliedMembrane=liveBody.weights(2,shapeTrainer.best);' in g
          assert 'episodic.weights(' not in g
          assert 'OnlineBodyLearning.Result result=liveBody.observe(' in g
          assert 'realTactileContact||type==0' in e
          assert 'episodic.suggested(senses,!protectMotor)' in s
          assert 'Recuperi da immobilità (0.9.7)' in t
          assert 'putString("best",encode(trainer.best))' in g
          assert 'putString("morph_brain_v07",encode(shapeTrainer.best))' in g
          print('Signed 0.9.7 motor stability, tactile-only recall, and preserved historic brains verified')
          PY
      - name: Verify physical experience-based choices without programmed sphere direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          policy=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          trial=Path('app/src/main/java/com/overmind/zero/OnlineBodyLearning.java').read_text()
          credit=Path('app/src/main/java/com/overmind/zero/ExperienceCredit.java').read_text()
          assert 'skillBank.retrieve(trainer.best)' in game
          assert 'trainer.best=alternate;' in game
          assert 'skillBank.observe(trainer.best,liveBody.lastBaselineNet' in game
          assert 'skillBank.observe(result.weights,liveBody.lastCandidateNet' in game
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in game
          assert 'sensorMind.contactOutcome(reserve-before,object.signature);' in game
          assert 'sensorMind.contactOutcome(reserve-prior,chamber.food.signature);' in game
          assert 'contactCredit.performed(senses,chosen);' in policy
          assert 'contactCredit.consequence(actualEnergyDelta,visuallyObservedSignature)' in policy
          assert 'sensoryBias' not in policy and 'sensoryGuide' not in policy
          assert 'history.descendingIterator()' in credit and 'energetic' in credit and 'mechanical' in credit
          assert 'motorCapable=domain!=MOTOR' in trial
          assert 'motor_skills_v098' in game and 'episodic_memory_v095' in game
          assert 'Math.atan2(chosenObject.y' not in game
          assert 'mind.choose(environment' not in game
          assert not Path('app/src/main/java/com/overmind/zero/SensoryValenceGuide.java').exists()
          print('ZERO 0.9.8 patch preserves autonomous chosen actions, rewards only real contacts, retains motors')
          PY
      - name: Gate 0.9.9 signed release on demonstrated tactile grip and valid rollback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          gate=Path('app/src/main/java/com/overmind/zero/ScarcityLab.java').read_text()
          grip=Path('app/src/main/java/com/overmind/zero/GripSkillBank.java').read_text()
          reset=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          assert 'gripBank.observe(lastAppliedHand,lastAppliedMembrane' in game
          assert 'gripBank.retrieve(' in game
          assert 'if(voluntaryGripAtGate&&!physicalHold)' in game
          assert 'chamber.constrain(creature,surface,slice,sensorMind.adhesion())' in game
          assert 'gateDriveFrames' in gate and 'gateCommandFrames' in gate and 'gateHeldFrames' in gate
          assert 'skin.gripHold[i]>=Morphology.GRIP_HOLD' in gate
          assert 'grip_skills_v099' in game and 'grip_skills_v099' in reset
          assert 'episodic.weights(' not in game
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in game
          assert 'lastAppliedHand=liveBody.weights(1,handTrainer.best);' in game
          assert 'lastAppliedMembrane=liveBody.weights(2,shapeTrainer.best);' in game
          assert 'actualDoorMotion' in grip
          print('ZERO-009.9: restored physical motor+hand+membrane independence, confirmed grip retention, no scripted adhesion')
          PY
      - name: Gate signed named saves, full physical scene and future safe reset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          ui=Path('app/src/main/java/com/overmind/zero/SaveSlotsActivity.java').read_text()
          slot=Path('app/src/main/java/com/overmind/zero/SaveSlotStore.java').read_text()
          scene=Path('app/src/main/java/com/overmind/zero/GameSceneSnapshot.java').read_text()
          code=Path('app/src/main/java/com/overmind/zero/SaveProfileCodec.java').read_text()
          journal=Path('app/src/main/java/com/overmind/zero/MotionExploration.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          reset=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          assert 'PARTITE' in g and 'SaveSlotsActivity.class' in g
          assert 'SaveSlotsActivity' in manifest and 'android:exported="false"' in manifest
          assert 'public static final int SLOTS=12' in slot
          assert 'zero_motorbrain_001' in slot and 'zero_save_slots_v100' in slot
          assert 'zero_save_slots_v100' not in reset
          assert 'protectCurrent();' in slot and 'PENDING_RELOAD' in slot
          assert 'working.edit().clear().putBoolean(PENDING_RELOAD,true).commit()' in slot
          assert 'SaveProfileCodec.encode(capture())' in slot
          assert 'MessageDigest.getInstance("SHA-256")' in code
          assert 'GameSceneSnapshot.capture(creature,surface,environment,chamber)' in g
          assert 'GameSceneSnapshot.restore(' in g
          assert 'saveScene();' in g and 'void suspend()' in g
          assert 'physical_scene_v100' in g and 'physical_scene_v100' in slot
          assert 'skin.gripCommand,skin.touchSense,skin.gripHold' in scene
          assert 'out.room.doorY=' in scene and 'out.objects.add(loadEntity(' in scene
          assert 'journey.saveLife()' in g and 'journey.loadLife(' in g
          assert 'RECUPERA ZERO PRECEDENTE' in ui
          assert 'NUOVA PARTITA' in ui and 'SOVRASCRIVI' in ui
          assert 'grip_skills_v099' in g and 'episodic_memory_v095' in g
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in g
          print('Signed ZERO 0.10.0: twelve named slots, original app identity, true physical checkpoint, SHA256, undo, no erased brains')
          PY
      - name: Gate 0.10.1 genuine source-separated outcome memory before signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          ep=Path('app/src/main/java/com/overmind/zero/EpisodicMemory.java').read_text()
          learner=Path('app/src/main/java/com/overmind/zero/ExperienceCredit.java').read_text()
          mind=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          assert 'episodic.consequenceSeparated(' in game
          assert 'energySinceAction[object.signature]+=reserve-before;' in game
          assert 'energySinceAction[chamber.food.signature]+=reserve-prior;' in game
          assert 'sensorMind.contactOutcome(reserve-before,object.signature);' in game
          assert 'outcome_credit_v101' in game and 'outcome_credit_v101' in Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          assert 'em3;' in ep and 'old.kind==kind&&old.source==source' in ep
          assert 'if(!relevant(e,senses))continue;' in ep
          assert 'if(learning&&physicalEffect>.015f)' in mind
          assert 'contactCredit.displaced(physicalEffect)' in mind
          assert 'contactCredit.value(senses,a)' in mind
          assert 'energetic' in learner and 'mechanical' in learner
          assert 'skin.gripCommand[i]>Morphology.GRIP_THRESHOLD' in Path('app/src/main/java/com/overmind/zero/ScarcityLab.java').read_text()
          assert 'GameSceneSnapshot.capture(creature,surface,environment,chamber)' in game
          print('Source-conditioned real energy, external displacement, old em1/em2 migration, and 12 named slots remain independent')
          PY
      - name: Verify 0.10.2 planner confidence gate and GitHub-backed OTA on stable signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/overmind/zero/LearnedSequencePlanner.java').read_text()
          b=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          u=Path('app/src/main/java/com/overmind/zero/UpdateClient.java').read_text()
          r=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/SaveSlotStore.java').read_text()
          assert 'd.heldoutTransitions<30' in p and 'd.errorAt(i)' in p
          assert 'float[] two=safePredict(model,next,action)' in p
          assert 'new LearnedSequencePlanner.Model()' in b and 'planned[a]' in b
          assert 'learned_planner_stats_v102' in g and 'learned_planner_stats_v102' in r
          assert 'MANIFEST_URL=' in u and 'BACKUP_MANIFEST_URL=' in u
          assert 'newestManifest()' in u and 'REDIRECT_LIMIT=6' in u
          assert 'MessageDigest.getInstance("SHA-256")' in u
          assert 'release-assets.githubusercontent.com' in u
          assert 'FLAG_GRANT_READ_URI_PERMISSION' in u
          assert 'canRequestPackageInstalls()' in u
          assert 'zero_save_slots_v100' in s and 'public static final int SLOTS=12' in s
          assert 'GameSceneSnapshot.capture(creature,surface,environment,chamber)' in g
          print('ZERO 0.10.2 signed gate: earned short horizon forecasts, source verified Vercel/GitHub update, unchanged installed identity')
          PY
      - name: Assemble stable signed APK
        if: env.signing_ready == 'true'
        run: gradle --no-daemon assembleRelease
      - name: Verify updater permissions and APK provider in signed manifest
        if: env.signing_ready == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -F "android.permission.INTERNET" "$RUNNER_TEMP/permissions.txt"
          grep -F "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/permissions.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F "com.overmind.zero.UpdateFileProvider" "$RUNNER_TEMP/manifest.txt"
          grep -F "com.overmind.zero.ota.updates" "$RUNNER_TEMP/manifest.txt"
          echo "Validated final signed APK: network, installer permission and update provider."
      - name: Publish signed APK to updater in main
        if: env.signing_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/signed-update.apk"
          VERSION_CODE=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionCode"])')
          VERSION_NAME=$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')
          APK_SHA=$(sha256sum "$RUNNER_TEMP/signed-update.apk" | awk '{print $1}')
          APK_SIZE=$(wc -c < "$RUNNER_TEMP/signed-update.apk" | tr -d ' ')
          git fetch origin main
          git checkout main
          mkdir -p updater/public/apk
          APK_FILENAME="overmind-zero-$VERSION_CODE-${APK_SHA:0:12}.apk"
          cp "$RUNNER_TEMP/signed-update.apk" "updater/public/apk/$APK_FILENAME"
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_FILENAME" "$APK_SHA" "$APK_SIZE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          vc, vn, filename, sha, size = sys.argv[1:]
          metadata={
            "schemaVersion":1,"available":True,
            "applicationId":"com.overmind.zero.ota",
            "versionCode":int(vc),"versionName":vn,
            "apkUrl":"https://overmind-zero-updates.vercel.app/apk/"+filename,
            "sha256":sha,"sizeBytes":int(size),
            "notes":"Aggiornamento OVERMIND ZERO verificato e firmato",
            "publishedAt":datetime.now(timezone.utc).isoformat()
          }
          with open("updater/public/latest.json","w",encoding="utf-8") as f:
            json.dump(metadata,f,indent=2)
          with open("docs/CHANGELOG.md","a",encoding="utf-8") as f:
            f.write("\n## OTA "+vn+" — "+metadata["publishedAt"]+"\n")
            f.write("- Pacchetto Android firmato pubblicato su Vercel (codice "+vc+").\n")
            f.write("- SHA-256: `"+sha+"`.\n")
            f.write("- APK: `/apk/"+filename+"`.\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater/public/latest.json updater/public/apk/ docs/CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Publish signed OVERMIND $VERSION_NAME OTA build"
          git push origin main
          echo "Signed APK committed to Vercel-linked branch main."
