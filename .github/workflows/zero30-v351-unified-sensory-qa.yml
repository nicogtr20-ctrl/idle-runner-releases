name: ZERO3 unified GRU194 real sensory cognitive physical model full-life QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3*.java'
      - 'tools/zero3_core_qa.py'
      - '.github/workflows/zero30-v351-unified-sensory-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual physical sensors, legacy compatibility and 2000-decision cold restart
        run: python3 tools/zero3_core_qa.py --variable-clock --cognitive --long-life 2000
      - name: Android Debug (no signed publisher)
        run: gradle --no-daemon assembleDebug
