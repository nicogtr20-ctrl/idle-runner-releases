name: ZERO3 V3.19 contextual adhesion real physics scientific gate
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3ContextAdhesionV319.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ContextAdhesionV319Regression.java'
      - '.github/workflows/zero30-v319-contextual-grip-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-arm-contextual-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real gel, immutable sensors, V3.18 incumbent and V3.19 contextual head
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          config=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',config,re.M)
          if not m:raise RuntimeError('Production Java solver compilation not found')
          root='app/src/main/java/com/overmind/zero/'
          required=['Zero3LearningFoundation.java','Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java','Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
            'Zero3SensoryFrameV315.java','Zero3CausalRecorderV315.java',
            'Zero3SensoryContractV315Regression.java',
            'Zero3MotorIntentV316.java','Zero3AutonomousLoopV317.java',
            'Zero3LearnedAdhesionV318.java',
            'Zero3LearnedAdhesionV318Regression.java',
            'Zero3ContextAdhesionV319.java',
            'Zero3ContextAdhesionV319Regression.java']
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[root+name for name in required],check=True)
          PY
      - name: Run 3072 new self-chosen decisions and paired 3-arm blind true-world physics
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3ContextAdhesionV319Regression | tee /tmp/v319.txt
          grep -q 'trainActorChosen=3072' /tmp/v319.txt
          grep -q 'blindEachArmActorChoices=2304' /tmp/v319.txt
          grep -q 'learningNeverSeesObjectIdentity=true' /tmp/v319.txt
          grep -q 'scientificGripGate=' /tmp/v319.txt
          grep -q 'G3_BLOCKED G5_BLOCKED NO_OTA' /tmp/v319.txt
