name: ZERO412 original GRU3 10000 real red hazard and motor context acceptance
on:
  push:
    branches: [fix/zero412-observable-inertia-and-ground-contact]
    paths:
      - 'app/src/**'
      - 'app/src/main/java/com/overmind/zero/Zero387TactileFrame.java'
      - 'app/src/main/java/com/overmind/zero/SquareCollisionSolver.java'
      - 'app/src/main/java/com/overmind/zero/TrainingRoomV379.java'
      - 'app/src/main/java/com/overmind/zero/GameActivity.java'
      - 'app/src/androidTest/java/com/overmind/zero/Zero406OriginalAutonomous10000DecisionAndroidTest.java'
      - 'app/src/main/java/com/overmind/zero/SymbioteMatterV1.java'
      - 'app/src/main/java/com/overmind/zero/SymbioteWorldStepV171.java'
      - '.github/workflows/zero412-original-wild-10000-red-contact-safety.yml'
  workflow_dispatch:
concurrency:
  group: zero412-wild-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  original-unseen-10000:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build native original game and Android instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ONE original GRU3 >=10000 unforced decisions with physical sense disambiguation and true red/blue physical touches
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb logcat -c; adb shell am instrument -w -r -e class com.overmind.zero.Zero406OriginalAutonomous10000DecisionAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000.txt"; adb logcat -d -s ZERO366_REAL:I ZERO397_AUTONOMY:I ZERO400_CREDIT:I ZERO401_CAUSAL:I ZERO404_HAZARD:I ZERO406_LONG:I ActivityTaskManager:I AndroidRuntime:E > "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; cat "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; grep -q "OK (1 test)" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000.txt"; grep -q "ZERO406_10000_ORIGINAL_G3_HAZARD_AND_LOCOMOTION_GATE=PASS" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; grep -q "ZERO406_REAL_10000_ORIGINAL_RESULT" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; grep -q "ZERO406_ACTUAL_1000 decision=" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; grep -q "localWeightUpdates=" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000_metrics.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/ZERO412_ORIGINAL_WILD_10000.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO412-original-genuine-10000-momentum-hazard-gru3
          path: ${{ runner.temp }}/ZERO412_ORIGINAL_WILD_10000*.txt
          if-no-files-found: warn
