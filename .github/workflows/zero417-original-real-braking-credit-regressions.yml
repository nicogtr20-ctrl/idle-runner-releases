name: ZERO460 original V371 PRE-coast residual Android regressions
on:
  push:
    branches: [lab/zero417-real-com-braking-credit-original-gru3, lab/zero418-isolated-decision-motor-credit, lab/zero420-original-high-level-motor-evidence-eligibility, lab/zero421-delivered-physical-probe-original-gru3, lab/zero422-learned-harm-candidate-coverage, lab/zero423-immediate-own-decision-motor-credit, lab/zero424-delivered-immediate-own-motor-credit, lab/zero425-tangent-realized-actor-credit, lab/zero426-joint-sampled-actor-score, lab/zero427-joint-score-offpolicy-eligibility, lab/zero428-uniform-random-impasse-actor-credit, lab/zero429-original-motor-map-harm-wall-causal-eligibility, lab/zero430-rear-retreat-inertial-attribution-gate, lab/zero431-rear-wall-local-cortex-acceleration-eligibility, lab/zero432-signed-rear-wall-delivered-probe-credit, lab/zero433-inertial-optical-physical-evidence, lab/zero434-observed-delayed-contact-without-motor-map, lab/zero435-accelerated-delayed-contact-evidence, lab/zero436-learned-harm-candidate-coverage-on-v435, lab/zero437-reused-heading-not-fresh-actor-score, lab/zero438-restore-fresh-candidate0-score, lab/zero439-measured-inertia-sensory-gain, lab/zero440-gru-inertia-observation-gain, lab/zero441-measured-sub2-drift-optical-eligibility, audit/zero441-real-wild-49-red-and-qa-false-fail-20261101, lab/zero442-no-unverified-delayed-bank-under-drift, lab/zero443-motor-evidence-eligibility-telemetry, lab/zero444-original-v377-heldout-evidence-diagnostics, lab/zero445-v377-bank-forward-heldout-forensic, lab/zero446-heldout-forward-authority-gate, lab/zero447-original-neural-choice-failure-forensics, lab/zero448-v319-original-timestep-guard-forensics, lab/zero449-v319-physical-post-lifecycle-trace, lab/zero450-world-stream-pre-post-episode-boundary, lab/zero451-original-choice-stage-red-contact-forensics, lab/zero452-cognition-score-component-red-forensics, lab/zero453-v353-score-margin-physical-evidence-audit, lab/zero454-motor-response-audit, lab/zero455-v454-matched-off-control, lab/zero457-v371-original-bank-evidence-forensics, lab/zero458-v371-heldout-forward-scale-ablation, lab/zero459-v371-coast-residual-motor-evidence, lab/zero460-v459-original-regression-shell-repair]
    paths: ['app/src/**','.github/workflows/zero417-original-real-braking-credit-regressions.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero417-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Motor eligibility, cortex GRU3 brain continuity, tactile and inertial regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/zero417-original-regressions.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero417-original-real-rear-wall-credit-gru3-save-regression
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn

# V443 final original Android four-gate SHA: diagnostic-only score eligibility.
