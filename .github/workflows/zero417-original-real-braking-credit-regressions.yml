name: ZERO422 learned physical harm optical actor alternatives (V417 comparator) original V3 full GRU3/motor/physical/cold resume regression
on:
  push:
    branches: [lab/zero417-real-com-braking-credit-original-gru3, lab/zero418-isolated-decision-motor-credit, lab/zero420-original-high-level-motor-evidence-eligibility, lab/zero421-delivered-physical-probe-original-gru3, lab/zero422-learned-harm-candidate-coverage]
    paths: ['app/src/**','.github/workflows/zero417-original-real-braking-credit-regressions.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero417-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Motor eligibility, cortex GRU3 brain continuity, tactile and inertial regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for test in Zero390IsolatedMotorCreditAndroidTest Zero387TactileContactAndroidTest Zero387DirectMotorCalibrationAndroidTest Zero386EffortAuthorityAndroidTest Zero384EmbodiedProprioAndroidTest Zero382ColdResumeAndroidTest Zero401LocalMotorCreditSafetyAndroidTest Zero406LongRunMetricIntegrityAndroidTest Zero409PhysicalContactLedgerAndroidTest Zero410OriginalNeuralDecisionBoundaryCheckpointAndroidTest Zero414RealRearWallMotorCreditSafetyAndroidTest Zero420MotorMapEligibilityAndroidTest Zero421OriginalDeliveredLocalProbeAndroidTest Zero422LearnedHarmCandidateCoverageAndroidTest; do adb shell am instrument -w -r -e class "com.overmind.zero.$test" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$test.txt"; grep -q "OK (" "$RUNNER_TEMP/$test.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$test.txt"; done; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero390IsolatedMotorCreditAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero401LocalMotorCreditSafetyAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero406LongRunMetricIntegrityAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero409PhysicalContactLedgerAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero410OriginalNeuralDecisionBoundaryCheckpointAndroidTest.txt"; grep -q "OK (2 tests)" "$RUNNER_TEMP/Zero414RealRearWallMotorCreditSafetyAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero420MotorMapEligibilityAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero421OriginalDeliveredLocalProbeAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero422LearnedHarmCandidateCoverageAndroidTest.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero417-original-real-rear-wall-credit-gru3-save-regression
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
