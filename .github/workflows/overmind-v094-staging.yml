name: OVERMIND 0.9.4 measurable adaptive locomotion
on:
  push:
    branches: [feature/overmind-v094-efficient-exploration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Motor evolution, loops, exploration, reset and world regression
        run: |
          mkdir -p /tmp/zero094
          javac -d /tmp/zero094 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,LearningDiagnostics,ResetDomains,MotionExploration,OnlineBodyLearning}.java
          for test in MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab SensorimotorMind LearningDiagnostics ResetDomains MotionExploration OnlineBodyLearning; do
            java -cp /tmp/zero094 com.overmind.zero.$test
          done
      - name: Verify real-world-only adaptation and safe selective resets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/OnlineBodyLearning.java').read_text()
          t=Path('app/src/main/java/com/overmind/zero/BrainToolsActivity.java').read_text()
          r=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          assert 'journey.observe(creature.cx,creature.cy,energyBeforeFrame,reserve)' in a
          assert 'lifeStamp==episode' in a
          assert 'journey.takeNewCells()' in a and 'liveStartX,liveStartY,creature.cx,creature.cy' in a
          assert 'liveBody.weights(0,trainer.best)' in a and 'trainer.attempt()' not in a
          assert 'CONFRONTA' not in a
          assert 'Real-world motor training' not in s
          assert 'useful=net>baseNet+1.5f' in s
          assert 'if(evaluate(200,0,0,0,3,0,0,0)>=' in s
          for domain in ['motor','hand','membrane']:
            assert 'online_accepted_'+domain+'_v094' in a
            assert 'online_rejected_'+domain+'_v094' in a
            assert 'online_accepted_'+domain+'_v094' in r
          assert 'ADATTAMENTO CORPOREO REALE' in t
          assert 'sensorMind.setLearning(true)' in a
          print('ZERO-009.4: persisted adaptive learning, truthful experiment overlay, no hidden goal and selective resets verified')
          PY
      - name: Compile Android Debug
        run: gradle --no-daemon assembleDebug
