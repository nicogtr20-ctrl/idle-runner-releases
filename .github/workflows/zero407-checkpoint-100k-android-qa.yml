name: ZERO407 original 3.0 over-100000 checkpoint and grip-overflow safety Android
on:
  push:
    branches: [fix/zero407-longrun-v3-checkpoint-integrity]
    paths: ['app/src/**','.github/workflows/zero407-checkpoint-100k-android-qa.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero407-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Motor eligibility, cortex GRU3 brain continuity, tactile and inertial regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for test in Zero390IsolatedMotorCreditAndroidTest Zero387TactileContactAndroidTest Zero387DirectMotorCalibrationAndroidTest Zero386EffortAuthorityAndroidTest Zero384EmbodiedProprioAndroidTest Zero382ColdResumeAndroidTest Zero401LocalMotorCreditSafetyAndroidTest Zero406LongRunMetricIntegrityAndroidTest Zero407ExtendedCheckpointSafetyAndroidTest; do adb shell am instrument -w -r -e class "com.overmind.zero.$test" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$test.txt"; grep -q "OK (" "$RUNNER_TEMP/$test.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$test.txt"; done; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero390IsolatedMotorCreditAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero401LocalMotorCreditSafetyAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero406LongRunMetricIntegrityAndroidTest.txt"; grep -q "OK (2 tests)" "$RUNNER_TEMP/Zero407ExtendedCheckpointSafetyAndroidTest.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero407-original-long-history-checkpoint-android
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
