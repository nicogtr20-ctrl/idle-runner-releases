name: ZERO387 genuine frame-local membrane touch and real-solid support
on:
  push:
    branches: [fix/zero387-contact-freshness-audit]
    paths:
      - 'app/src/**'
      - '.github/workflows/zero387-sensor-contact-regressions.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tactile-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile real Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Repeat physical stale-touch/new-wall-body learning/room/cold-resume regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for fixture in Zero387TactileContactAndroidTest Zero387DirectMotorCalibrationAndroidTest Zero384EmbodiedProprioAndroidTest Zero379SingleTrainingRoomAndroidTest Zero382ColdResumeAndroidTest; do adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$fixture.txt"; grep -q "OK (" "$RUNNER_TEMP/$fixture.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$fixture.txt"; done'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero387-real-membrane-contact-qa
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
