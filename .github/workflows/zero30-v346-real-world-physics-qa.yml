name: ZERO3 V3.46 G1 real room BOX gate final-world physics optin research A/B
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3AutonomousLoopV317.java'
      - 'app/src/main/java/com/overmind/zero/Zero3SurvivalLedgerV323.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RuntimeV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3GruSensoryV347.java'
      - 'app/src/main/java/com/overmind/zero/Zero3VitalV327Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CausalVitalBoundaryV344.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CausalVitalBoundaryV344Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointBoxConstraintV338.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointRuntimeV346Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CapacityV327Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3AndroidSessionV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3LabActivityV326.java'
      - '.github/workflows/zero30-v346-real-world-physics-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-vital-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual recurrent actor, gel, metabolism, archives and V3.27 gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          source=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',source,re.M)
          if not m:raise RuntimeError('production Java material compile list unavailable')
          root='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3SurvivalLedgerV323 Zero3SurvivalArchiveV323 Zero3SurvivalRestartV323Regression Zero3RoomStateV324 Zero3RoomArchiveV324 Zero3RuntimeV325 Zero3MotorEvidenceV330 Zero3ContactTopologyExperimentV336 Zero3SegmentedArchiveV328 Zero3ReplayJournalV329 Zero3RuntimeV325Regression Zero3WorldBirthV326 Zero3VitalV327Regression Zero3CapacityV327Regression Zero3CausalVitalBoundaryV344 Zero3CausalVitalBoundaryV344Regression Zero3RecurrentBrain Zero3GruSensoryV347 Zero3JointBoxConstraintV338 Zero3JointRuntimeV346Regression'
          subprocess.run(shlex.split(m.group(1))+[root+n+'.java' for n in names.split()],check=True)
          PY
      - name: Vital causality, brain CHOICES and real material cost
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3VitalV327Regression | tee /tmp/v327-vitals.log
          grep -q 'V327 VITAL_FROM_ACTUAL_METABOLISM=PASS RECURRING_ACTION_CHANGED=PASS NO_FUTURE_LEAK=PASS' /tmp/v327-vitals.log
      - name: V346 independent real V325 world room gate disk BOX A/B with research-only joint topology
        run: |
          set -euo pipefail
          java -Xmx2048m -cp /tmp/overmind com.overmind.zero.Zero3JointRuntimeV346Regression | tee /tmp/v346-physics.log
          grep -q 'V346 SCIENCE_GATE candidateComplete=' /tmp/v346-physics.log
          test "$(grep -c 'V346 SCENE scene=' /tmp/v346-physics.log)" -eq 8
          grep -q 'NEVER_PROMOTE_TO_ANDROID=true G1_OPEN' /tmp/v346-physics.log
      - name: Ensure legacy V325 physics input, metabolic and full restart unchanged
        run: |
          set -euo pipefail
          java -Xmx1600m -cp /tmp/overmind com.overmind.zero.Zero3CausalVitalBoundaryV344Regression | tee /tmp/v346-old-runtime.log
          grep -q 'V344 COLD_RESTART_BITWISE_IDENTICAL=PASS' /tmp/v346-old-runtime.log
      - name: Android debug build, never OTA
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon assembleDebug; then
              echo 'V344_ANDROID_DEBUG=PASS'
              exit 0
            fi
            if gradle --offline --no-daemon assembleDebug; then
              echo 'V327_ANDROID_DEBUG=PASS'
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Do not promote partial G1 science from technical CI status
        run: echo 'V346_RESEARCH_ONLY_UNSAVABLE_PHYSICS_G1_NOT_PROMOTED G4_G5_G6_G7_G8_G9_G10_BLOCKED NO_OTA NO_MERGE'
