      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production gel and real neural sensorimotor pipeline
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
