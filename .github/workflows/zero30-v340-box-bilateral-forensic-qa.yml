          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3JointWorldV339 Zero3ExactFaceTrialV336Regression Zero3ActuatedContactStressV336Regression Zero3BilateralFaceAuditV340 Zero3BilateralForensicV340Regression'
          subprocess.run(shlex.split(m.group(1))+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: Read-only true BOX face grip and 64-muscle forensic on consumed V339 BLIND
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3BilateralForensicV340Regression | tee /tmp/v340-face.log
          test "$(grep -c 'V340 BOX_LIFE arm=' /tmp/v340-face.log)" -eq 18
          test "$(grep -c 'V340 BOX_TOTAL arm=' /tmp/v340-face.log)" -eq 3
          grep -q 'V340 ORIGINAL_REPLICATION 1546,0,1384 true BOX bilateral match=true' /tmp/v340-face.log
          grep -q 'V340 DIAGNOSTIC_ONLY noMotorPhysicsLearningChanges=true' /tmp/v340-face.log
      - name: Original physical grip / three object isolation after research
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -cp /tmp/overmind com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/overmind com.overmind.zero.SquareGripPuzzle
      - name: Build Android Debug but never publish OTA
        run: gradle --no-daemon assembleDebug
      - name: Keep candidate and learning gates blocked
        run: echo 'V340_CAUSAL_FORENSIC_CONSUMED_ONLY_NO_G3_PROMOTION G3_BLOCKED G5_BLOCKED NO_OTA NO_MERGE'
