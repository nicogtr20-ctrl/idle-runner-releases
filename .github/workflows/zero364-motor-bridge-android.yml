name: ZERO364 GRU3 sole actor with proven physical motor peripheral (NO OTA)
on:
  push:
    branches: [fix/zero364-block-regressed-ota-and-forensic-20261019]
  pull_request:
    branches: [release/zero30-ota]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  android-original:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile complete original Android application and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: KVM permission
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 4 physically positive headings, V319 unchanged, no shadow brain
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.overmind.zero.Zero364MotorBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zero364-bridge-android.txt
            grep -q 'OK (3 tests)' /tmp/zero364-bridge-android.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366VisionMemoryAndPlannerTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zero366-cognition-android.txt
            grep -q 'OK (4 tests)' /tmp/zero366-cognition-android.txt
      - name: Capture Android real original gel proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V364-single-GRU-real-4way-motor
          path: |
            /tmp/zero364-bridge-android.txt
            /tmp/zero366-cognition-android.txt
