name: ZERO380 physical/spectral corrective Android QA (no OTA)
on:
  push:
    branches: [fix/zero380-training-physical-spectral-recovery]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile real original Android and instrumentation tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Corrected red blue blockage wall and regression Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for fixture in Zero380FailureReproductionAndroidTest Zero379SingleTrainingRoomAndroidTest Zero378PhysicalMotorCreditAndroidTest Zero377TrueInertialMotorAndroidTest Zero375GoalMemorySafetyAndroidTest Zero374RealTouchOpticalIdentityAndroidTest; do echo "RUN $fixture"; adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "/tmp/$fixture.txt"; grep -q "OK (" "/tmp/$fixture.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "/tmp/$fixture.txt"; done'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero380-red-blue-physics-corrective-qa
          path: |
            /tmp/Zero380*.txt
            /tmp/Zero379*.txt
            /tmp/Zero378*.txt
            /tmp/Zero377*.txt
            /tmp/Zero375*.txt
            /tmp/Zero374*.txt
