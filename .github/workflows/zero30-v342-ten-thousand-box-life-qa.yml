name: ZERO3 V3.42 10000 consecutive physical BOX experiences per organism
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3LongBoxExperienceV342Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointWorldV339.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointBoxConstraintV338.java'
      - 'app/src/main/java/com/overmind/zero/Zero3JointWorldV339.java'
      - 'app/src/main/java/com/overmind/zero/Zero3LongBoxExperienceV342Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ContactTopologyExperimentV336.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - '.github/workflows/zero30-v342-ten-thousand-box-life-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-actuated:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production gel and real neural sensorimotor pipeline
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError("original production Java physical compile list absent")
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3JointWorldV339 Zero3ExactFaceTrialV336Regression Zero3ActuatedContactStressV336Regression Zero3LongBoxExperienceV342Regression'
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: 3 genuine continuous 10000-decision BOX lives, no resets, strict 120k frames per brain
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3LongBoxExperienceV342Regression | tee /tmp/v342-10000.log
          test "$(grep -c 'V342 RESULT arm=' /tmp/v342-10000.log)" -eq 3
          test "$(grep -c 'V342 WINDOW arm=' /tmp/v342-10000.log)" -le 30
          grep -q 'V342 LONG_HORIZON_VERDICT completeAll3=' /tmp/v342-10000.log
          grep -q 'G3_BLOCKED G5_BLOCKED NO_OTA NO_MERGE' /tmp/v342-10000.log
      - name: Original physical grip / three object isolation after research
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -cp /tmp/overmind com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/overmind com.overmind.zero.SquareGripPuzzle
      - name: Build Android Debug but never publish OTA
        run: gradle --no-daemon assembleDebug
      - name: Keep candidate and learning gates blocked
        run: echo 'V342_SAME_LIFE_10000_PHYSICS_NOT_YET_FULL_SAVE_RESTART G3_BLOCKED G5_BLOCKED NO_OTA NO_MERGE'
