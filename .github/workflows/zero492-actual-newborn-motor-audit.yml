name: ZERO492 actual new V489 newborn physical causality
on:
  push:
    branches:
      - lab/zero492-actual-newborn-motor-causality
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-newborn-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout unchanged original 170-site world and V490 learning fix
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct the user's actual Nov 7 4747-decision brain and physical scene
        run: |
          set -euo pipefail
          git fetch --depth=1 origin zero-telemetry:refs/remotes/origin/zero-telemetry
          python3 - <<'PY'
          import json,subprocess,pathlib
          root='zero-telemetry/reports/20261107-105525-1972ed240cfcd/'
          def read(path):
              data=subprocess.check_output(['git','show','origin/zero-telemetry:'+path])
              return json.loads(data)
          idx=read('zero-telemetry/current.json')
          assert idx['reportId']=='20261107-105525-1972ed240cfcd'
          assert idx['zero3Summary']['completedDecisions']==4747
          p1=read(root+'part-001.json')
          p2=read(root+'part-002.json')
          fragments=[]
          for i in range(3,22):
              part=read(root+'part-%03d.json'%i)
              assert part['reportId']==idx['reportId']
              assert part['key']=='zero3_original_brain_only_v356'
              assert part['fragmentIndex']==i-3 and part['fragmentCount']==19
              fragments.append(part['jsonFragment'])
          checkpoint=json.loads(''.join(fragments))['zero3_original_brain_only_v356']
          scene=p1['currentZero']['physical_scene_v100']
          physical=json.loads(scene)
          assert physical['version']==1
          assert len(physical['surface']['x'])==96
          assert len(physical['symbiote']['x'])==64
          assert len(checkpoint)>10000
          saved=dict(reportId=idx['reportId'],brain=checkpoint,
                     physical_scene_v100=scene)
          out=pathlib.Path('/tmp/zero492-nov07-newborn-readonly.json')
          out.write_text(json.dumps(saved))
          print('ZERO492 exact newborn report=',idx['reportId'],
                'brain bytes=',len(checkpoint),'snapshot bytes=',len(scene))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android matched true newborn four-heading motor and 192 muscle A/B
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Android/data/com.overmind.zero.ota/files
            adb push /tmp/zero492-nov07-newborn-readonly.json /sdcard/Android/data/com.overmind.zero.ota/files/zero492-nov07-newborn-readonly.json
            adb logcat -c
            adb shell am instrument -w -r -e class com.overmind.zero.Zero490DeliveredLearnPathAndroidTest,com.overmind.zero.Zero492ActualNewbornMotorCausalityAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO492_NEWBORN_TESTS.txt"
            adb logcat -d -s ZERO492_NEWBORN:I > "$RUNNER_TEMP/ZERO492_NEWBORN_PHYSICAL_SIGN.txt"
            cat "$RUNNER_TEMP/ZERO492_NEWBORN_PHYSICAL_SIGN.txt"
            grep -q "OK (3 tests)" "$RUNNER_TEMP/ZERO492_NEWBORN_TESTS.txt"
            grep -q "ORIGINAL_USER_4747_PHYSICAL_CAUSALITY_COMPLETE" "$RUNNER_TEMP/ZERO492_NEWBORN_PHYSICAL_SIGN.txt"
            ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/ZERO492_NEWBORN_TESTS.txt"
      - name: Preserve all actual-body sign measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO492-Nov7-actual-user-newborn-170-material-physical-causality
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ZERO492_NEWBORN_*.txt
            app/build/reports/androidTests/connected/
