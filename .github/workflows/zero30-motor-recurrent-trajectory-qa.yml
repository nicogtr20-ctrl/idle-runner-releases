name: ZERO3 V3.8 recurrent 32-step motor dynamics - blind physics QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3MotorRecurrentTrajectoryRegression.java'
      - '.github/workflows/zero30-motor-recurrent-trajectory-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recurrent-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile full real material solver with recurrent dynamics laboratory
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          s=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',s,re.M)
          if not m:
              raise RuntimeError('Production physical JVM baseline list unavailable')
          command=shlex.split(m.group(1))+[
              'app/src/main/java/com/overmind/zero/Zero3LearningFoundation.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorResponseKernel.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorRetentionRegression.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorPromotionGate.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorImpulseResponseRegression.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorLongHorizonRegression.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorTemporalHistoryRegression.java',
              'app/src/main/java/com/overmind/zero/Zero3MotorRecurrentTrajectoryRegression.java']
          subprocess.run(command,check=True)
          PY
      - name: Learn 32-step motor response trajectory only from real paired physical samples
        run: java -cp /tmp/overmind com.overmind.zero.Zero3MotorRecurrentTrajectoryRegression
