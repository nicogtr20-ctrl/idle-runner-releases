name: ZERO3 V3.18 learned physical adhesion head QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3LearnedAdhesionV318.java'
      - 'app/src/main/java/com/overmind/zero/Zero3LearnedAdhesionV318Regression.java'
      - '.github/workflows/zero30-v318-adhesion-learning-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physically-learned-adhesion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile unchanged production gel, real box/grip physics, v317 actor and trainable v318 head
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          src=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',src,re.M)
          if m is None:raise RuntimeError('Real production Java solver command not found')
          root='app/src/main/java/com/overmind/zero/'
          needs=['Zero3LearningFoundation.java','Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java','Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
            'Zero3SensoryFrameV315.java','Zero3CausalRecorderV315.java',
            'Zero3SensoryContractV315Regression.java',
            'Zero3MotorIntentV316.java','Zero3AutonomousLoopV317.java',
            'Zero3LearnedAdhesionV318.java',
            'Zero3LearnedAdhesionV318Regression.java']
          subprocess.run(shlex.split(m.group(1))+[root+x for x in needs],check=True)
          PY
      - name: Measure legal learned adhesive motor commands and real blind grip against frozen head
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3LearnedAdhesionV318Regression | tee /tmp/zero318.txt
          grep -q 'actorChosenTrainDecisions=3072' /tmp/zero318.txt
          grep -q 'scientificGripGate=' /tmp/zero318.txt
          grep -q 'noSensorInjection=true' /tmp/zero318.txt
          grep -q 'NO_GAIT G3_BLOCKED G5_BLOCKED NO_OTA' /tmp/zero318.txt
