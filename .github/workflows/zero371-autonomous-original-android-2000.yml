name: ZERO371 actual original-world autonomous 2000 blind — never OTA
on:
  push:
    branches: [fix/zero371-unified-causal-motor-memory-20261020]
    paths:
      - '.github/workflows/zero371-autonomous-original-android-2000.yml'
      - 'app/src/main/java/com/overmind/zero/**'
      - 'app/src/androidTest/java/com/overmind/zero/Zero366OriginalAutonomousSurvival2000Test.java'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero371-unseen-blind-current-source
  cancel-in-progress: true
jobs:
  original-unscripted-2000:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build authentic original Android game with unchanged world/physics
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Blind free choice, real contacts and locomotion
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm clear com.overmind.zero.ota
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366OriginalAutonomousSurvival2000Test com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero371-blind-result.txt
            grep -q 'ZERO366_BLIND_2000_UNSCRIPTED_SURVIVAL_G3_G5_PRELIMINARY=PASS_NOT_PHONE' /tmp/zero371-blind-result.txt
      - name: Publish complete raw science logs including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO371-blind-unscripted-2000-honest-results
          path: /tmp/zero371-blind-result.txt
