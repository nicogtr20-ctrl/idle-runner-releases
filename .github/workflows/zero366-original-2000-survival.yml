name: ZERO366 blind original game 2000 autonomous choices — survival evidence (NO OTA)
on:
  push:
    branches: [fix/zero364-block-regressed-ota-and-forensic-20261019]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-autonomous-red-blue-2000:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Real original Android game and neuroscience instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: KVM original emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 2000 WHOLE self-chosen actions in original world, no test-only destination or rewards
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/zero366_original_2000_survival.sh
      - name: Save positive OR negative original autonomously observed outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO366-autonomous-2000-physical-red-blue-evidence
          path: /tmp/zero366-blind-2000-original.txt
