name: ZERO377 single-GRU inertial motor response original Android QA, NO OTA
on:
  push:
    branches: [fix/zero377-inertia-aware-motor-20261020]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile actual Android application and tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Emulator accelerator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run V370 wind source + V368/V369 regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.overmind.zero.Zero377InertialMotorResponseAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero377-inertia.txt
            grep -q 'OK (5 tests)' /tmp/zero377-inertia.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero376DynamicTurnOriginalGelAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero376-turn.txt
            grep -q 'OK (1 test)' /tmp/zero376-turn.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero375GoalMemoryRiskAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero375-late-life.txt
            grep -q 'OK (3 tests)' /tmp/zero375-late-life.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero374RealTouchOpticalIdentityAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero374-contact.txt
            grep -q 'OK (5 tests)' /tmp/zero374-contact.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero371RealMotorEnergyBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero371-causal.txt
            grep -q 'OK (6 tests)' /tmp/zero371-causal.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero372FrozenPeripheralProbeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero372-frozen-probe.txt
            grep -q 'OK (2 tests)' /tmp/zero372-frozen-probe.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero364MotorBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero371-4direction.txt
            grep -q 'OK (3 tests)' /tmp/zero371-4direction.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero370WindSenseIsolationAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero370-wind.txt
            grep -q 'OK (3 tests)' /tmp/zero370-wind.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero369LearnedContactValenceAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero369-contact.txt
            grep -q 'OK (4 tests)' /tmp/zero369-contact.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero368CausalIntegrationTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero369-v368-backcompat.txt
            grep -q 'OK (4 tests)' /tmp/zero369-v368-backcompat.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366VisionMemoryAndPlannerTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero369-v366-compat.txt
            grep -q 'OK (5 tests)' /tmp/zero369-v366-compat.txt
      - name: Save proof and failures, no signing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO377-true-motor-and-40-regressions-no-OTA
          path: |
            /tmp/zero377-inertia.txt
            /tmp/zero376-turn.txt
            /tmp/zero375-late-life.txt
            /tmp/zero374-contact.txt
            /tmp/zero372-frozen-probe.txt
            /tmp/zero371-4direction.txt
            /tmp/zero371-causal.txt
            /tmp/zero370-wind.txt
            /tmp/zero369-contact.txt
            /tmp/zero369-v368-backcompat.txt
            /tmp/zero369-v366-compat.txt
