name: OVERMIND ZERO v0.4 staging tests
on:
  push:
    branches:
      - feature/overmind-v04-physical-learning
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test physical learning and collision invariants
        run: |
          mkdir -p /tmp/overmindv04
          javac -d /tmp/overmindv04 app/src/main/java/com/overmind/zero/MotorBrain.java app/src/main/java/com/overmind/zero/UnknownWorld.java app/src/main/java/com/overmind/zero/ContactLearning.java
          java -cp /tmp/overmindv04 com.overmind.zero.MotorBrain
          java -cp /tmp/overmindv04 com.overmind.zero.UnknownWorld
          java -cp /tmp/overmindv04 com.overmind.zero.ContactLearning
      - name: Compile Android debug staging APK
        run: gradle --no-daemon assembleDebug
