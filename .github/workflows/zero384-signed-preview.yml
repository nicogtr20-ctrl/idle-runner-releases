name: ZERO384 measured proprioception and learned impasse signed install preview
on:
  push:
    branches: [fix/zero384-embodied-proprio-obstacle-learning]
    paths: ['.github/workflows/zero384-signed-preview.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  signed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVERMIND_BUILD_NUMBER: '194'
      OVERMIND_CANDIDATE_NAME: '3.0-ota.384-body.1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Require successful source-pinned 30/30 Android QA and unchanged public update
        run: |
          set -euo pipefail
          git diff --quiet 55ce6ad0a3c5c841b9428ed7371fcfb36951dcd0 HEAD -- app/src app/build.gradle
          test -f app/src/main/java/com/overmind/zero/TrainingRoomV379.java
          test -f app/src/androidTest/java/com/overmind/zero/Zero384EmbodiedProprioAndroidTest.java
          python3 - <<'PY'
          import json,urllib.request
          url='https://api.github.com/repos/nicogtr20-ctrl/idle-runner-releases/actions/runs/40045832231'
          with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'ZERO384-QA'}),timeout=20) as response:
              run=json.load(response)
          assert run['head_sha']=='55ce6ad0a3c5c841b9428ed7371fcfb36951dcd0'
          assert run['conclusion']=='success' and run['status']=='completed'
          print('ZERO384_30_ANDROID_TESTS_PLUS_MAIN_QA=PASS')
          # This is NOT success-proof of steering. Require the exact user's
          # original trained V380 checkpoint test to have completed, and keep
          # inverse calibration gated off when it cannot prove real authority.
          with urllib.request.urlopen(urllib.request.Request(
              'https://api.github.com/repos/nicogtr20-ctrl/idle-runner-releases/actions/runs/40041324641',
              headers={'Accept':'application/vnd.github+json','User-Agent':'ZERO384-USER-BRAIN-QA'}),timeout=20) as response:
              user_trial=json.load(response)
          assert user_trial['head_sha']=='bdb49a2f32bf5c5959c92804f95b5548d76f941a'
          assert user_trial['conclusion']=='success' and user_trial['status']=='completed'
          print('BASE_V383_SAVED_USER_CHECKPOINT_VALIDATION=PASS')
          PY
          git fetch origin main
          python3 - <<'PY'
          import json,subprocess
          manifest=json.loads(subprocess.check_output(['git','show','origin/main:updater/public/latest.json'],text=True))
          assert manifest['applicationId']=='com.overmind.zero.ota'
          assert manifest['versionCode']==1188 and manifest['versionName']=='3.0-ota.378-test.1'
          print('STABLE_OTA_IS_UNCHANGED_AND_COMPATIBLE=PASS')
          PY
      - name: Restore same production signing certificate privately
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,base64,json,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw:raise RuntimeError('Stable signing bundle is unavailable')
          data=json.loads(base64.b64decode(raw,validate=True))
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero384-stable-signing.p12'
          target.write_bytes(base64.b64decode(data['keyStoreBase64'],validate=True))
          target.chmod(0o600)
          for secret in (data['password'],data['alias']):print('::add-mask::'+secret)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write('OVERMIND_KEYSTORE_FILE='+str(target)+'\n')
              e.write('OVERMIND_KEYSTORE_PASSWORD='+data['password']+'\n')
              e.write('OVERMIND_KEY_PASSWORD='+data['password']+'\n')
              e.write('OVERMIND_KEY_ALIAS='+data['alias']+'\n')
          PY
      - name: Build signed install-over-existing experimental APK
        run: gradle --no-daemon assembleRelease
      - name: Verify original certificate and Android versionCode 1194 before distribution
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$bt/apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/zero384-cert.txt"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/zero384-package.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ['RUNNER_TEMP'])
          cert=(root/'zero384-cert.txt').read_text()
          expected='45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583'
          assert 'certificate SHA-256 digest: '+expected in cert,'Signing identity mismatch'
          pkg=(root/'zero384-package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in pkg
          assert "versionCode='1194'" in pkg and "versionName='3.0-ota.384-body.1'" in pkg
          meta=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert meta['elements'][0]['versionCode']==1193
          apk=Path('app/build/outputs/apk/release/app-release.apk').read_bytes()
          print('SIGNATURE_PACKAGE_VERSION_ALL_PASS sha256='+hashlib.sha256(apk).hexdigest())
          PY
          mkdir -p "$RUNNER_TEMP/zero384-release"
          cp "$apk" "$RUNNER_TEMP/zero384-release/OVERMIND-ZERO-BODY384-LEARNED-OBSTACLES.apk"
          sha256sum "$RUNNER_TEMP/zero384-release/OVERMIND-ZERO-BODY384-LEARNED-OBSTACLES.apk" > "$RUNNER_TEMP/zero384-release/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ZERO384-signed-installable-preview
          path: |
            ${{ runner.temp }}/zero384-release/OVERMIND-ZERO-BODY384-LEARNED-OBSTACLES.apk
            ${{ runner.temp }}/zero384-release/SHA256.txt
          if-no-files-found: error
      - name: Publish standalone signed prerelease; do not change Vercel or latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=overmind-zero-v3.0-ota.384-body-preview
          asset="$RUNNER_TEMP/zero384-release/OVERMIND-ZERO-BODY384-LEARNED-OBSTACLES.apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1;then
            echo "Immutable tag already exists: refusing to overwrite signed artifact"
            exit 1
          fi
          gh release create "$tag" "$asset" "$RUNNER_TEMP/zero384-release/SHA256.txt" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title 'OVERMIND ZERO 3.0 — Propriocezione ed ostacoli appresi V384 (anteprima firmata)' --prerelease \
            --notes 'ZERO384 PREVIEW SPERIMENTALE: migliorata la percezione degli esiti corporei. Nuovo archivio opzionale impara dalle esperienze reali di contatto con superfici solide, confrontando comando muscolare, deformazione fisica e avanzamento del corpo. I fallimenti ripetuti e verificati separatamente possono ridurre il punteggio di una direzione realmente bloccata e consentire esperimenti autonomi a ZERO, senza una regola muro-gira o un secondo cervello. Conserva GRU64 e i 194 ingressi, memoria preesistente, 12 salvataggi, fisica del corpo, motore 75/25 e attrito V382. Compilazione e 30 regressioni Android superate, inclusi restart e collisioni; uscita dal muro e miglioramento dell intelligenza NON ancora dimostrati in 2000 decisioni reali. VersionCode 1194 e stessa firma originale, installare sopra V383 senza disinstallare, effettuare backup del cervello. L OTA stabile e il manifest Vercel restano invariati.'
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero384-stable-signing.p12"
