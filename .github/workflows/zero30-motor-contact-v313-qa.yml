name: ZERO3 V3.13 real-contact learned state/action dynamics QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3MotorContactWorldV313Regression.java'
      - '.github/workflows/zero30-motor-contact-v313-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-contact-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile full unchanged world material collision and model
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          s=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',s,re.M)
          if m is None: raise RuntimeError('Official physical compilation reference missing')
          root='app/src/main/java/com/overmind/zero/'
          files=['Zero3LearningFoundation.java','Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java','Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLongHorizonRegression.java',
            'Zero3MotorTemporalHistoryRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
            'Zero3MotorContactWorldV313Regression.java']
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[root+f for f in files],check=True)
          PY
      - name: Run preregistered causal touch/pulse/grip ablation with unseen physical worlds
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3MotorContactWorldV313Regression | tee /tmp/zero313.txt
          grep -q 'ZERO3 V313 SUMMARY' /tmp/zero313.txt
          grep -q 'futureStatesLeak=false' /tmp/zero313.txt
          grep -q 'NO_OTA' /tmp/zero313.txt
