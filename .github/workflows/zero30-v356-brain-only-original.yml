name: ZERO3 V356 brain-only on original game — no APK publication
on:
  push:
    branches: [feature/zero30-brain-only-original-game]
  workflow_dispatch:
  pull_request:
    branches: [fix/zero30-original-game-v355]
permissions:
  contents: read
jobs:
  original-app-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Confirm exact original game physics and menu foundation
        run: |
          set -euo pipefail
          for path in \
            app/src/main/java/com/overmind/zero/GameActivity.java \
            app/src/main/java/com/overmind/zero/ScarcityLab.java \
            app/src/main/java/com/overmind/zero/SquareCollisionSolver.java \
            app/src/main/java/com/overmind/zero/SquareGripPuzzle.java; do
              git cat-file -e origin/feature/zero22-active-recurrent-ota117:"$path"
              # Original app's full GameActivity is the comparison authority.
              # V3 physics regressions require extra overloaded test APIs in
              # square/room classes. Default original mechanics remain the
              # same; later physical A/B tests independently verify parity.
              if [[ "$path" == *GameActivity.java ]]; then
                python3 - <<'PY'
          from pathlib import Path
          from difflib import SequenceMatcher
          import subprocess
          name='app/src/main/java/com/overmind/zero/GameActivity.java'
          a=subprocess.check_output(['git','show','origin/feature/zero22-active-recurrent-ota117:'+name]).decode()
          b=Path(name).read_text()
          score=SequenceMatcher(None,a.splitlines(),b.splitlines(),autojunk=False).ratio()
          assert score>.91, f'Original game Java drifted: similarity={score:.3f}'
          for essential in ['void updateHabitat(float dt)','void resolveObjects(float dt)',
                            'void resetEpisode()','void saveScene()','boolean restoreScene',
                            'void renderWorld(Canvas c)','void renderBody(Canvas c)',
                            'void renderHud(Canvas c)','void renderDock(Canvas c)',
                            'void renderSettings(Canvas c)','void settingsChoice(int index)']:
            assert essential in b, essential
          assert 'zero3.step()' not in b and 'drawZero3(' not in b
          print('ORIGINAL_GAME_UI_PHYSICS_STRUCTURE=PASS, similarity=',round(score,4))
          PY
              fi
          done
      - name: Android compile and original existing test suite
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: No V355 dashboard as launcher / no signed publisher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          assert 'Zero3DashboardActivityV354.class' not in code or 'new android.content.Intent' in code
          assert 'drawZero3(' not in code
          assert 'zero3.step()' not in code
          assert 'void resetEpisode()' in code
          print('ORIGINAL_GAME_OWNER_STATIC=PASS; no independent V355 game runtime')
          PY
  android-original-world:
    needs: [original-app-compile]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Original GameActivity + V3 sole motor actor + original life reset + save/restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/zero356_android_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V356-original-game-real-android-QA
          path: /tmp/zero356-ui

  signed-original-game-candidate:
    needs: [original-app-compile, android-original-world]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVERMIND_BUILD_NUMBER: '174'
      OVERMIND_CANDIDATE_NAME: '3.0-candidate.356'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore existing stable signing identity for private candidate artifact only
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          bundle=os.environ.get('SIGNING_BUNDLE','')
          if not bundle: raise RuntimeError('Stable signing identity unavailable; no installable candidate produced')
          obj=json.loads(base64.b64decode(bundle,validate=True))
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero356-candidate.p12'
          key.write_bytes(base64.b64decode(obj['keyStoreBase64'],validate=True));key.chmod(0o600)
          for value in [obj['password'],obj['alias']]:print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('OVERMIND_KEYSTORE_FILE='+str(key)+'\n')
            out.write('OVERMIND_KEYSTORE_PASSWORD='+obj['password']+'\n')
            out.write('OVERMIND_KEY_PASSWORD='+obj['password']+'\n')
            out.write('OVERMIND_KEY_ALIAS='+obj['alias']+'\n')
          PY
      - name: Build private phone candidate, never invoke OTA publisher
        run: gradle --no-daemon assembleRelease
      - name: Verify stable certificate, package, same-version replaceability and source provenance
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p /tmp/zero356-phone-candidate
          apk_path=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk_path" > /tmp/zero354-certificate.txt
          "$build_tools/aapt" dump badging "$apk_path" > /tmp/zero354-package.txt
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          certificate=pathlib.Path('/tmp/zero354-certificate.txt').read_text()
          expected='45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583'
          assert 'certificate SHA-256 digest: '+expected in certificate
          package=pathlib.Path('/tmp/zero354-package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in package and "versionCode='1174'" in package
          assert "versionName='3.0-candidate.356'" in package
          source=pathlib.Path('app/build/outputs/apk/release/app-release.apk').read_bytes()
          root=pathlib.Path('/tmp/zero356-phone-candidate')
          (root/'ZERO3-candidate-356.apk').write_bytes(source)
          (root/'provenance.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(source).hexdigest(),'bytes':len(source),'applicationId':'com.overmind.zero.ota','versionCode':1174,'versionName':'3.0-candidate.356','certificateSha256':expected,'publication':'private CI artifact; stable OTA172 manifest unchanged'},indent=2))
          print('SIGNED_CANDIDATE_IDENTITY=PASS; no stable OTA publication')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZERO3-signed-phone-candidate-356
          path: /tmp/zero356-phone-candidate
      - name: Remove temporary private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero356-candidate.p12"
