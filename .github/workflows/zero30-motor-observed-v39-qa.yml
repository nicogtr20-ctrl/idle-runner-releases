name: ZERO3 V3.9 observed state-action motor dynamics QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3MotorObservedTransitionV39Regression.java'
      - '.github/workflows/zero30-motor-observed-v39-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real material solver and V3.9 isolated model
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib, re, shlex, subprocess
          pub=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          match=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',pub,re.M)
          if match is None:
              raise RuntimeError('Cannot locate baseline production body source list')
          files=[
            'Zero3LearningFoundation.java',
            'Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java',
            'Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLongHorizonRegression.java',
            'Zero3MotorTemporalHistoryRegression.java',
            'Zero3MotorObservedTransitionV39Regression.java',
          ]
          root='app/src/main/java/com/overmind/zero/'
          subprocess.run(shlex.split(match.group(1))+[root+f for f in files],check=True)
          PY
      - name: Test physical 64-channel action recording, one-step fit, free-state 32-block replay and independent gates
        run: |
          set -euo pipefail
          java -Xmx768m -cp /tmp/overmind com.overmind.zero.Zero3MotorObservedTransitionV39Regression | tee /tmp/zero39.txt
          grep -q 'ZERO3 V39 FINAL' /tmp/zero39.txt
          grep -q 'futureStatesLeak=false' /tmp/zero39.txt
          grep -q 'NO_GAMEPLAY NO_OTA' /tmp/zero39.txt
