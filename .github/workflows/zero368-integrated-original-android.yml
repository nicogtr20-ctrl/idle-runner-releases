name: ZERO368 terminal and vision integration — research only, NEVER sign OTA
on:
  push:
    branches:
      - fix/zero368-terminal-vision-motor-integration-20261019
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-game-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile original app and complete Android instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: KVM permission
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise original game, historical and new regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash tools/zero362_android_ui.sh
            adb shell pm clear com.overmind.zero.ota
            adb shell am instrument -w -r -e class com.overmind.zero.Zero364MotorBridgeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zero368-motor.txt
            grep -q 'OK (3 tests)' /tmp/zero368-motor.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366VisionMemoryAndPlannerTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zero368-legacy.txt
            grep -q 'OK (5 tests)' /tmp/zero368-legacy.txt
            adb shell am instrument -w -r -e class com.overmind.zero.Zero368CausalIntegrationTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/zero368-new.txt
            grep -q 'OK (3 tests)' /tmp/zero368-new.txt
      - name: Upload technical test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero368-original-android-technical
          path: |
            /tmp/zero362-qa
            /tmp/zero368-motor.txt
            /tmp/zero368-legacy.txt
            /tmp/zero368-new.txt
  blind-survival-research:
    needs: original-game-technical
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build actual game
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: KVM permission
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Independent blind autonomous behavior (may legitimately FAIL)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm clear com.overmind.zero.ota
            adb shell am instrument -w -r -e class com.overmind.zero.Zero366OriginalAutonomousSurvival2000Test com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee /tmp/zero368-blind.txt
            grep -q 'OK (1 test)' /tmp/zero368-blind.txt
      - name: Preserve scientific failure, never bypass OTA release hold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero368-blind-unscripted-behavior
          path: /tmp/zero368-blind.txt
