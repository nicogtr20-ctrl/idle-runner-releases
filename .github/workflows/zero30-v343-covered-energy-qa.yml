name: ZERO3 V3.43 finite covered energy physical causal gate
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3CoveredEnergyV343.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CoveredEnergyV343Regression.java'
      - '.github/workflows/zero30-v343-covered-energy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  causal-world-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production physical world with frozen lab-only energy bridge
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError('original source compiler contract missing')
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3SurvivalLedgerV323 Zero3WorldBirthV326 Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3JointWorldV339 Zero3ExactFaceTrialV336Regression Zero3CoveredEnergyV343 Zero3CoveredEnergyV343Regression'
          subprocess.run(shlex.split(m.group(1))+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: Check cover physics, actual contact finite energy and negative controls
        run: |
          set -euo pipefail
          java -Xmx1400m -cp /tmp/overmind com.overmind.zero.Zero3CoveredEnergyV343Regression | tee /tmp/v343-covered.log
          grep -q 'V343 COVERED_ENERGY_GATE PASS' /tmp/v343-covered.log
          java -cp /tmp/overmind com.overmind.zero.OpticalCues
          java -cp /tmp/overmind com.overmind.zero.UnknownWorld
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
      - name: Compile Android Debug without signing or OTA
        run: gradle --no-daemon assembleDebug
      - name: Prevent premature value learning claims
        run: echo 'V343_PHYSICAL_ENERGY_ONLY NO_LEARNED_VALUE_PROOF G3_BLOCKED G5_BLOCKED NO_OTA NO_MERGE'
