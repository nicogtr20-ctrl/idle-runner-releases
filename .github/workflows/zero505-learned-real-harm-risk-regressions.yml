name: ZERO505 physically experienced harmful wavelength risk regression
on:
  push:
    branches: [lab/zero505-physically-learned-optical-harm-envelope]
    paths: ['.github/workflows/zero505-learned-real-harm-risk-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cognition-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android observed negative valence and V371 fallback safety
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class com.overmind.zero.Zero505LearnedPhysicalRiskEnvelopeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO505_RISK_TESTS.txt"
            adb logcat -d -s ZERO505_RISK:I > "$RUNNER_TEMP/ZERO505_RISK_DIAG.txt"
            cat "$RUNNER_TEMP/ZERO505_RISK_DIAG.txt"
            grep -q 'OK (2 tests)' "$RUNNER_TEMP/ZERO505_RISK_TESTS.txt"
            grep -q 'MEASURED_CONTACT_ONLY_OPTICAL_RISK_GATE=PASS' "$RUNNER_TEMP/ZERO505_RISK_DIAG.txt"
            ! grep -qE 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' "$RUNNER_TEMP/ZERO505_RISK_TESTS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO505-real-learned-harm-unknown-inertia-regression
          path: ${{ runner.temp }}/ZERO505_RISK_*.txt
          if-no-files-found: warn
