name: ZERO491 matched motor physics audit
on:
  push:
    branches:
      - lab/zero491-cardinal-drift-motor-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motor-causality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for real Android physics instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test matched S21 muscles and diagonal inertial drift on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.overmind.zero.Zero490DeliveredLearnPathAndroidTest,com.overmind.zero.Zero490FourHeadingMatchedActuatorAndroidTest,com.overmind.zero.Zero491CardinalDriftMotorAuthorityAndroidTest"
      - name: Preserve test reports and physical-sign diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO491-real-material-motor-audit
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
