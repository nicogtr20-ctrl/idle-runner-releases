name: ZERO501 V499 original GRU3 194/64/512 backward regression
on:
  push:
    branches: [lab/zero501-v499-cortex-regression-and-saved-crc]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero417-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Motor eligibility, cortex GRU3 brain continuity, tactile and inertial regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for test in Zero390IsolatedMotorCreditAndroidTest Zero387TactileContactAndroidTest Zero387DirectMotorCalibrationAndroidTest Zero386EffortAuthorityAndroidTest Zero384EmbodiedProprioAndroidTest Zero382ColdResumeAndroidTest Zero401LocalMotorCreditSafetyAndroidTest Zero406LongRunMetricIntegrityAndroidTest Zero409PhysicalContactLedgerAndroidTest Zero410OriginalNeuralDecisionBoundaryCheckpointAndroidTest Zero414RealRearWallMotorCreditSafetyAndroidTest Zero420MotorMapEligibilityAndroidTest Zero421OriginalDeliveredLocalProbeAndroidTest Zero422LearnedHarmCandidateCoverageAndroidTest Zero425TangentActorCreditAndroidTest Zero426JointSampleActorScoreAndroidTest Zero427JointOffPolicyEligibilityAndroidTest Zero428RandomUniformActorCreditAndroidTest Zero431RearWallMuscleEligibilityAndroidTest Zero432RearWallDeliveredProbeAndroidTest Zero433InertialOpticalEvidenceAndroidTest Zero434ObservedDelayedContactAndroidTest Zero435AcceleratedDelayedContactAndroidTest Zero442DelayedBankDriftEligibilityAndroidTest Zero446HeldoutForwardAuthorityAndroidTest Zero454PairedPhysicalMotorContrastAndroidTest Zero461V319OriginalGripExplorationAblationAndroidTest Zero468CrossLifeEfferenceAndroidTest Zero470CoarseFineRayConsistencyAndroidTest Zero472V371HeldoutForwardScaleAndroidTest Zero473V371PreInertiaResidualAndroidTest Zero474V371ResidualPhysicalTravelAndroidTest Zero475V474FallbackReachabilityAndroidTest Zero476V377TransientMidDriftAndroidTest Zero478MeasuredPassiveCoastOpticalAndroidTest Zero479SingleCountPassiveOpticalAndroidTest Zero480VerifiedPhysicalOpticalSingleCountAndroidTest Zero482LearnedHarmEvidenceMarginAndroidTest Zero487ObservedMotorBaselineAndroidTest Zero488EffortConditionedMotorBaselineAndroidTest Zero489MatchedPreMotorResponseAndroidTest; do adb shell am instrument -w -r -e class "com.overmind.zero.$test" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$test.txt"; grep -q "OK (" "$RUNNER_TEMP/$test.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$test.txt"; done; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero390IsolatedMotorCreditAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero401LocalMotorCreditSafetyAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero406LongRunMetricIntegrityAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero409PhysicalContactLedgerAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero410OriginalNeuralDecisionBoundaryCheckpointAndroidTest.txt"; grep -q "OK (2 tests)" "$RUNNER_TEMP/Zero414RealRearWallMotorCreditSafetyAndroidTest.txt"; grep -q "OK (9 tests)" "$RUNNER_TEMP/Zero420MotorMapEligibilityAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero421OriginalDeliveredLocalProbeAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero422LearnedHarmCandidateCoverageAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero425TangentActorCreditAndroidTest.txt"; grep -q "OK (8 tests)" "$RUNNER_TEMP/Zero426JointSampleActorScoreAndroidTest.txt"; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero427JointOffPolicyEligibilityAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero428RandomUniformActorCreditAndroidTest.txt"; grep -q "OK (6 tests)" "$RUNNER_TEMP/Zero431RearWallMuscleEligibilityAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero432RearWallDeliveredProbeAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero433InertialOpticalEvidenceAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero434ObservedDelayedContactAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero435AcceleratedDelayedContactAndroidTest.txt"; grep -q "OK (5 tests)" "$RUNNER_TEMP/Zero442DelayedBankDriftEligibilityAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero446HeldoutForwardAuthorityAndroidTest.txt"; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero461V319OriginalGripExplorationAblationAndroidTest.txt"; grep -q "OK (1 test)" "$RUNNER_TEMP/Zero468CrossLifeEfferenceAndroidTest.txt"; grep -q "OK (2 tests)" "$RUNNER_TEMP/Zero470CoarseFineRayConsistencyAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero472V371HeldoutForwardScaleAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero473V371PreInertiaResidualAndroidTest.txt"; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero474V371ResidualPhysicalTravelAndroidTest.txt"; grep -q "OK (1 test)" "$RUNNER_TEMP/Zero475V474FallbackReachabilityAndroidTest.txt"; grep -q "OK (6 tests)" "$RUNNER_TEMP/Zero476V377TransientMidDriftAndroidTest.txt"; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero478MeasuredPassiveCoastOpticalAndroidTest.txt"; grep -q "OK (3 tests)" "$RUNNER_TEMP/Zero479SingleCountPassiveOpticalAndroidTest.txt"; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero482LearnedHarmEvidenceMarginAndroidTest.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero417-original-real-rear-wall-credit-gru3-save-regression
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn

