name: ZERO3 V3.36 2k physical-frame conservative topology stress
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3ContactTopologyExperimentV336.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExactFaceTrialV336Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ContactLongStressV336Regression.java'
      - '.github/workflows/zero30-v336-long-stress-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-and-guarded-world:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real gel and isolated topology experiment
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          w=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',w,re.M)
          if not m: raise RuntimeError('original physical source list missing')
          r='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3FiveArmAblationV333Regression Zero3BoxCrossingForensicV334Regression Zero3BoxSubstageForensicV335Regression Zero3ContactTopologyExperimentV336 Zero3ExactFaceTrialV336Regression Zero3ContactLongStressV336Regression'
          subprocess.run(shlex.split(m.group(1))+[r+n+'.java' for n in names.split()],check=True)
          PY
      - name: Baseline short comparison and two 2000-frame genuine physical bodies
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3ExactFaceTrialV336Regression | tee /tmp/v336face.log
          grep -q 'V336 COMBINED_TRIAL matchedBirths=6' /tmp/v336face.log
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3ContactLongStressV336Regression | tee /tmp/v336long.log
          grep -q 'V336 LONG_STRESS totalRealSolverFrames=5024' /tmp/v336long.log
          test "$(grep -c 'V336 STRESS_RESULT id=' /tmp/v336long.log)" -eq 6
      - name: Baseline grip and multiple-object contract
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.SquareCollisionSolver
          java -cp /tmp/overmind com.overmind.zero.SquareGripPuzzle
          java -cp /tmp/overmind com.overmind.zero.MultiObjectGripRegression
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3ContextAdhesionV319Regression | tee /tmp/v319.log
          grep -q 'scientificGripGate=PASS' /tmp/v319.log
      - name: Android Debug compile, no sign and no OTA
        run: gradle --no-daemon assembleDebug
      - name: No automatic promotion from physical diagnostics
        run: echo 'V336_RESEARCH_ONLY G3_BLOCKED G5_BLOCKED NO_MERGE NO_OTA'
