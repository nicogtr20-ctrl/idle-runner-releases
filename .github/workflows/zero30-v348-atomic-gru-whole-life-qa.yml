name: ZERO3 V3.48 atomic GRU64 whole-life cold restart scientific checkpoint QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3AutonomousLoopV317.java'
      - 'app/src/main/java/com/overmind/zero/Zero3SurvivalLedgerV323.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RuntimeV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3GruSensoryV347.java'
      - 'app/src/main/java/com/overmind/zero/Zero3VitalV327Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CausalVitalBoundaryV344.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CausalVitalBoundaryV344Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RecurrentBrain.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RecurrentBrainCheckpointV345Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3GruRuntimeV347Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3GruWholeLifeV348Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3OrganismStoreV322.java'
      - 'app/src/main/java/com/overmind/zero/Zero3SegmentedArchiveV328.java'
      - 'app/src/main/java/com/overmind/zero/Zero3CapacityV327Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3AndroidSessionV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3LabActivityV326.java'
      - '.github/workflows/zero30-v348-atomic-gru-whole-life-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-vital-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile actual recurrent actor, gel, metabolism, archives and V3.27 gate
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          source=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',source,re.M)
          if not m:raise RuntimeError('production Java material compile list unavailable')
          root='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3SurvivalLedgerV323 Zero3SurvivalArchiveV323 Zero3SurvivalRestartV323Regression Zero3RoomStateV324 Zero3RoomArchiveV324 Zero3RuntimeV325 Zero3MotorEvidenceV330 Zero3ContactTopologyExperimentV336 Zero3SegmentedArchiveV328 Zero3ReplayJournalV329 Zero3RuntimeV325Regression Zero3WorldBirthV326 Zero3VitalV327Regression Zero3CapacityV327Regression Zero3CausalVitalBoundaryV344 Zero3CausalVitalBoundaryV344Regression Zero3RecurrentBrain Zero3GruSensoryV347 Zero3JointBoxConstraintV338 Zero3RecurrentBrainRegression Zero3RecurrentBrainCheckpointV345Regression Zero3GruRuntimeV347Regression Zero3GruWholeLifeV348Regression'
          subprocess.run(shlex.split(m.group(1))+[root+n+'.java' for n in names.split()],check=True)
          PY
      - name: Vital causality, brain CHOICES and real material cost
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3VitalV327Regression | tee /tmp/v327-vitals.log
          grep -q 'V327 VITAL_FROM_ACTUAL_METABOLISM=PASS RECURRING_ACTION_CHANGED=PASS NO_FUTURE_LEAK=PASS' /tmp/v327-vitals.log
      - name: Existing G4 neural checkpoint completeness and actual recurrent physical behavior
        run: |
          set -euo pipefail
          java -Xmx1600m -cp /tmp/overmind com.overmind.zero.Zero3RecurrentBrainCheckpointV345Regression | tee /tmp/v347-gru-state.log
          grep -q 'V345 GRU64_ACTOR_DUAL_CRITIC_CHECKPOINT=PASS' /tmp/v347-gru-state.log
      - name: Exactly one GRU owner in real V325 world, true V323 metabolic consequence
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3GruRuntimeV347Regression | tee /tmp/v347-actual-world.log
          test "$(grep -c 'V347 REAL_ACTOR scene=' /tmp/v347-actual-world.log)" -eq 4
          grep -q 'V347 G4_LIVE_GRU_RESULT fullLives=' /tmp/v347-actual-world.log
          grep -q 'G4_AND_G7_NOT_PROMOTED NO_OTA NO_MERGE' /tmp/v347-actual-world.log
      - name: Versioned V348 whole-organism GRU checkpoint, exact restart and fail-closed corruption
        run: |
          set -euo pipefail
          java -Xmx1900m -cp /tmp/overmind com.overmind.zero.Zero3GruWholeLifeV348Regression | tee /tmp/v348-life-restart.log
          grep -q 'V348 GRU_WHOLE_LIFE_ATOMIC=PASS' /tmp/v348-life-restart.log
      - name: Original V317 remains default and bytewise V328 cold restarts unchanged
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3CausalVitalBoundaryV344Regression | tee /tmp/v347-default-guard.log
          grep -q 'V344 COLD_RESTART_BITWISE_IDENTICAL=PASS' /tmp/v347-default-guard.log
      - name: Android debug build, never OTA
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon assembleDebug; then
              echo 'V345_ANDROID_DEBUG=PASS'
              exit 0
            fi
            if gradle --offline --no-daemon assembleDebug; then
              echo 'V327_ANDROID_DEBUG=PASS'
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Retain G4 blocker: fixed 12 step timing and absent device validation
        run: echo 'V348_GRU_FULL_SAME_LIFE_LAB_CHECKPOINT ONLY G4_G7_PARTIAL NO_G4_PROMOTION NO_OTA NO_MERGE'
