name: ZERO 0.9.7 retained locomotion staging
on:
  push:
    branches: [fix/overmind-v097-motor-retention]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Real locomotion, episodic recall, reset and physics JVM regression
        run: |
          mkdir -p /tmp/zero097
          javac -d /tmp/zero097 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,LearningDiagnostics,ResetDomains,MotionExploration,OnlineBodyLearning,EpisodicMemory,MotorAutonomyGuard}.java
          for test in MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab SensorimotorMind LearningDiagnostics ResetDomains MotionExploration OnlineBodyLearning EpisodicMemory MotorAutonomyGuard; do
            java -cp /tmp/zero097 com.overmind.zero.$test
          done
      - name: Motor regression invariant and persistent rollback audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          e=Path('app/src/main/java/com/overmind/zero/EpisodicMemory.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          r=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          h=Path('app/src/main/java/com/overmind/zero/MotorAutonomyGuard.java').read_text()
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in g
          assert 'episodic.weights(0,' not in g
          assert 'if(actedFromMemory)liveBody.abortTrial();' not in g
          assert 'boolean mixedWeights=recalledManipulationInAction;' in g
          assert 'OnlineBodyLearning.Result result=mixedWeights?null:liveBody.observe(' in g
          assert 'episodic.weights(1,' in g and 'episodic.weights(2,' in g
          assert 'realTactileContact||type==0' in e
          assert 'motorGuard.observe(slice,creature.cx,creature.cy,newlyMeasuredEffect);' in g
          assert 'episodic.suggested(senses,!protectMotor)' in s
          assert 'lastAppliedMembrane,px,py,slice' in g
          assert 'episodic_memory_v095' in g and 'putString("best",encode(trainer.best))' in g
          assert 'case MOTOR:' in r and 'motor_recoveries_v097' in r
          assert 'case EPISODES:' in r and 'physical_replays_v097' in r
          assert 'MIN_WORLD_EFFECT' in h and 'MIN_NET_PROGRESS' in h
          assert 'Math.atan2(chosenObject.y' not in g
          print('ZERO-009.7: save the best learned motor, no blind replay, tactile grip only, recovery without direction oracle')
          PY
      - name: Build Android debug APK
        run: gradle --no-daemon assembleDebug
