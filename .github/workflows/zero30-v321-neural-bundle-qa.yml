name: ZERO3 V3.21 joint neural checkpoint and physical restart gate
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3LearningFoundation.java'
      - 'app/src/main/java/com/overmind/zero/Zero3AutonomousLoopV317.java'
      - 'app/src/main/java/com/overmind/zero/Zero3NeuralBundleStoreV321.java'
      - 'app/src/main/java/com/overmind/zero/Zero3IntegratedRestartV321Regression.java'
      - '.github/workflows/zero30-v321-neural-bundle-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-neural-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile production material world and integrated neuroplastic modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          src=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          cmd=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',src,re.M)
          if not cmd:raise RuntimeError('production physical Java compiler list missing')
          root='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3IntegratedRestartV321Regression'
          subprocess.run(shlex.split(cmd.group(1))+[root+x+'.java' for x in names.split()],check=True)
          PY
      - name: Separate JVM trains 768 actor choices and stores joint neural state
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3IntegratedRestartV321Regression prefix /tmp/zero321 | tee /tmp/v321-prefix.log
          grep -q 'PREFIX trainingEpisodes=8 actorChoices=768' /tmp/v321-prefix.log
      - name: Separate JVM recovers recurrent actor cortex adhesion and resumes
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3IntegratedRestartV321Regression resume /tmp/zero321 /tmp/zero321-resumed.txt | tee /tmp/v321-resume.log
          grep -q 'RESUME gen=3 actorChoices=1536' /tmp/v321-resume.log
      - name: Separate JVM trains without restart and compares bytewise brain and real behavior
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3IntegratedRestartV321Regression reference /tmp/zero321 /tmp/zero321-reference.txt | tee /tmp/v321-reference.log
          cmp /tmp/zero321-resumed.txt /tmp/zero321-reference.txt
          grep -q 'encoderUpdates=1536' /tmp/zero321-resumed.txt
          grep -q 'adhesionUpdates=1536' /tmp/zero321-resumed.txt
          grep -q 'autonomousDecisions=512' /tmp/zero321-resumed.txt
          cat /tmp/zero321-resumed.txt
          echo 'ZERO3 V321 RESTART_BITWISE_AND_PHYSICAL_RETENTION=PASS'
      - name: Separate JVM injects corrupt neural bundle and tests safe rollback
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3IntegratedRestartV321Regression corrupt /tmp/zero321 | tee /tmp/v321-corrupt.log
          grep -q 'rolledBackChoices=768' /tmp/v321-corrupt.log
          grep -q 'bothGenerationsBadFailClosed=true' /tmp/v321-corrupt.log
          echo 'ZERO3 V321 NEURAL_BUNDLE_GATE=PASS NOT_FULL_BRAIN_SNAPSHOT G3_BLOCKED G5_BLOCKED NO_OTA'
