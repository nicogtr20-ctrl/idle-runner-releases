name: ZERO502 experimental candidate real Android original-body activation
on:
  push:
    branches: [lab/zero502-v499-candidate-phone-activation]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-original-phone-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable real Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual original 3.0 game boots with signed-candidate flags and same V499 before first action
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            OVERMIND_CANDIDATE_NAME=3.0-ota.502-exp.1 gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class com.overmind.zero.Zero502SignedCandidatePostureBootAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE.txt"
            adb logcat -d -s ZERO502_CANDIDATE:I ZERO502_POSTURE_BETA:W AndroidRuntime:E > "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE_metrics.txt"
            cat "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE_metrics.txt"
            grep -q "OK (1 test)" "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE.txt"
            grep -q "ORIGINAL_ANDROID_CANDIDATE_V489_FLAGS_PLUS_V499_BOOT_PASS" "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE_metrics.txt"
            ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/ZERO502_REAL_CANDIDATE.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO502-real-Android-candidate-V499-boot-proof
          if-no-files-found: warn
          path: ${{ runner.temp }}/ZERO502_REAL_CANDIDATE*.txt
