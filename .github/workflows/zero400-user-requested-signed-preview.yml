name: ZERO400 MANUAL user-requested signed original GRU3 experimental local motor preview
on:
  push:
    branches: [preview/zero400-signed-manual-phone-test]
    paths: ['.github/workflows/zero400-user-requested-signed-preview.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  signed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVERMIND_BUILD_NUMBER: '200'
      OVERMIND_CANDIDATE_NAME: '3.0-ota.400-local-motor-preview.1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Verify certified signing workflow and exact experimental source, do not modify stable OTA
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/overmind/zero/Zero3OriginalBrainV356.java
          test -f app/src/main/java/com/overmind/zero/GameActivity.java
          grep -Fq 'brain3.requestLocalTemporalCreditLabV400();' app/src/main/java/com/overmind/zero/GameActivity.java
          grep -Fq 'cortex.learnV332' app/src/main/java/com/overmind/zero/Zero3OriginalBrainV356.java
          grep -Fq 'getResources().getBoolean(R.bool.zero3_candidate)' app/src/main/java/com/overmind/zero/GameActivity.java
          python3 - <<'PY'
          import json,urllib.request
          base='https://api.github.com/repos/nicogtr20-ctrl/idle-runner-releases/actions/runs/'
          req=lambda rid: urllib.request.Request(base+str(rid),headers={'Accept':'application/vnd.github+json','User-Agent':'ZERO400-MANUAL-PREVIEW'})
          def run(rid):
              with urllib.request.urlopen(req(rid),timeout=30) as response:return json.load(response)
          regress=run(40720216608)
          assert regress['conclusion']=='success' and regress['head_sha']=='37bd2106f8778ab22aaefd66cbc6c1e3100e761c', 'Unexpected V400 regression baseline'
          autonomy=run(40720216856)
          assert autonomy['conclusion']=='failure' and autonomy['head_sha']=='37bd2106f8778ab22aaefd66cbc6c1e3100e761c', 'V400 2000-decision result changed: require review'
          print('ZERO400_ORIGINAL_2000: 19.88% steering / 3 red / 1 blue => SCIENCE FAIL; explicitly requested manual preview only')
          PY
          git fetch origin main
          python3 - <<'PY'
          import subprocess,json
          data=json.loads(subprocess.check_output(['git','show','origin/main:updater/public/latest.json'],text=True))
          assert data['applicationId']=='com.overmind.zero.ota' and data['versionCode']==1188
          print('UNMODIFIED_STABLE_UPDATE_CHANNEL=PASS')
          PY
      - name: Restore same production signing certificate privately
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,base64,json,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw:raise RuntimeError('Stable signing bundle is unavailable')
          data=json.loads(base64.b64decode(raw,validate=True))
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero400-stable-signing.p12'
          target.write_bytes(base64.b64decode(data['keyStoreBase64'],validate=True))
          target.chmod(0o600)
          for secret in (data['password'],data['alias']):print('::add-mask::'+secret)
          with open(os.environ['GITHUB_ENV'],'a') as e:
              e.write('OVERMIND_KEYSTORE_FILE='+str(target)+'\n')
              e.write('OVERMIND_KEYSTORE_PASSWORD='+data['password']+'\n')
              e.write('OVERMIND_KEY_PASSWORD='+data['password']+'\n')
              e.write('OVERMIND_KEY_ALIAS='+data['alias']+'\n')
          PY
      - name: Build signed install-over-existing experimental APK
        run: gradle --no-daemon assembleRelease
      - name: Verify original production certificate and compatible versionCode 1200
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$bt/apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/zero400-cert.txt"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/zero400-package.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          root=Path(os.environ['RUNNER_TEMP'])
          cert=(root/'zero400-cert.txt').read_text()
          expected='45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583'
          assert 'certificate SHA-256 digest: '+expected in cert,'Signing identity mismatch'
          pkg=(root/'zero400-package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in pkg
          assert "versionCode='1200'" in pkg and "versionName='3.0-ota.400-local-motor-preview.1'" in pkg
          meta=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert meta['elements'][0]['versionCode']==1200
          apk=Path('app/build/outputs/apk/release/app-release.apk').read_bytes()
          print('SIGNATURE_PACKAGE_VERSION_ALL_PASS sha256='+hashlib.sha256(apk).hexdigest())
          PY
          mkdir -p "$RUNNER_TEMP/zero400-release"
          cp "$apk" "$RUNNER_TEMP/zero400-release/OVERMIND-ZERO-V400-LOCAL-MOTOR-EXPERIMENTAL.apk"
          sha256sum "$RUNNER_TEMP/zero400-release/OVERMIND-ZERO-V400-LOCAL-MOTOR-EXPERIMENTAL.apk" > "$RUNNER_TEMP/zero400-release/SHA256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ZERO400-signed-installable-preview
          path: |
            ${{ runner.temp }}/zero400-release/OVERMIND-ZERO-V400-LOCAL-MOTOR-EXPERIMENTAL.apk
            ${{ runner.temp }}/zero400-release/SHA256.txt
          if-no-files-found: error
      - name: Publish standalone signed prerelease; do not change Vercel or latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=overmind-zero-v3.0-ota.400-local-motor-manual-preview
          asset="$RUNNER_TEMP/zero400-release/OVERMIND-ZERO-V400-LOCAL-MOTOR-EXPERIMENTAL.apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1;then
            echo "Immutable tag already exists: refusing to overwrite signed artifact"
            exit 1
          fi
          gh release create "$tag" "$asset" "$RUNNER_TEMP/zero400-release/SHA256.txt" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title 'OVERMIND ZERO V400 — prova manuale locomozione locale ritardata (SPERIMENTALE)' --prerelease \
            --notes 'ANTEPRIMA SPERIMENTALE V400 RICHIESTA ESPLICITAMENTE PER TEST SUL TELEFONO. Questa NON e una release stabile e NON dimostra che ZERO abbia imparato a evitare i rossi. V400 modifica soltanto la plasticita motoria del GRU3 originale: credito locale delle 16 zone con risposta temporale ritardata V332, con normale cervello 3.0, presa V319, e tutte le 12 memorie originali conservate. VERSIONE 1200 firmata con lo stesso certificato dei precedenti APK, installabile sopra V388 senza disinstallare, package com.overmind.zero.ota invariato. TEST: su 2004 decisioni autonome Android la direzionalita sale da 8.80% a 19.88%, ma le gemme blu scendono da 2 a 1 e i contatti rossi salgono da 1 a 3; pertanto VALIDAZIONE GENERALE FALLITA. Prima di installare: condividi/esporta un backup del cervello e dei 12 slot; installa sopra la versione esistente senza rimuoverla. Se osservi regressioni, conserva i dati e segnala i log. Questa APK NON aggiorna il canale OTA stabile, latest.json, ne altera la versione sul Play Store. Certificato originale verificato con apksigner, versione Android controllata e SHA256 inclusa.'
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero400-stable-signing.p12"
