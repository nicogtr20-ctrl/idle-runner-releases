name: ZERO383 physically validated original GRU exploration and motor regression QA
on:
  push:
    branches: [fix/zero383-motor-validated-exploration]
    paths:
      - 'app/src/**'
      - '.github/workflows/zero383-motor-validation-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile original GRU3 + V382 restart and material lab
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cold-open corrupt auxiliary, original brain identity, matched floor A/B, earlier motor regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for fixture in Zero382ColdResumeAndroidTest Zero382BrakePhysicalABAndroidTest Zero381PhysicalMotorCalibrationAndroidTest Zero380FailureReproductionAndroidTest Zero379SingleTrainingRoomAndroidTest Zero378PhysicalMotorCreditAndroidTest Zero377TrueInertialMotorAndroidTest Zero376DynamicTurnOriginalGelAndroidTest Zero364MotorBridgeAndroidTest; do echo "RUN $fixture"; adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$fixture.txt"; grep -q "OK (" "$RUNNER_TEMP/$fixture.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$fixture.txt"; done'
      - name: Require physically validated-direction gate independently of S21 data
        run: |
          echo 'The exact original-user checkpoint is tested in separate ZERO383 user-save QA.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO383-original-motor-sensory-regressions-and-cold-restart
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
