name: ZERO378 real original-gel inertia-corrected motor QA (no OTA)
on:
  push:
    branches: [fix/zero378-physical-inertial-credit-20261020]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-original-body:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Compile original Android game and instrumentation tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Allow KVM emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real 170-node braking, turning, frozen peripherals and contact safety
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            bash -c 'set -euo pipefail; for fixture in Zero378PhysicalMotorCreditAndroidTest Zero376DynamicTurnOriginalGelAndroidTest Zero377TrueInertialMotorAndroidTest Zero375GoalMemorySafetyAndroidTest Zero374RealTouchOpticalIdentityAndroidTest Zero372FrozenPeripheralProbeAndroidTest Zero371RealMotorEnergyBridgeAndroidTest Zero364MotorBridgeAndroidTest; do echo "RUN_REAL_GEL $fixture"; adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "/tmp/${fixture}.txt"; grep -q "OK (" "/tmp/${fixture}.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "/tmp/${fixture}.txt"; done'
      - name: Preserve QA observations (never an OTA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZERO378-original-body-physical-qa
          path: /tmp/Zero*.txt
