name: ZERO3 V355 original-game restoration and real GRU
on:
  push:
    branches: [fix/zero30-original-game-v355]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'tools/zero3_core_qa.py'
      - 'tools/fixtures/**'
      - 'tools/zero354_android_ui.sh'
      - '.github/workflows/zero30-v355-original-game.yml'
  pull_request:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/zero30-v355-original-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-core:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Full real organism, observer freeze, profile integrity, joint contact and 10000-decision cold restart
        run: python3 tools/zero3_core_qa.py --variable-clock --cognitive --completion --independent --long-life 10000
      - name: Android candidate compile, no stable publisher
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero3-v355-candidate-build
          path: app/build/outputs/apk/debug/*.apk
  android-ui:
    env:
      OVERMIND_CANDIDATE_NAME: '3.0-candidate.355'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Original GameActivity V355 plus real neural dashboard and restart (API35 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/zero354_android_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero3-v355-real-ui-and-results
          path: |
            /tmp/zero354-ui
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
  signed-phone-candidate:
    needs: [complete-core, android-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVERMIND_BUILD_NUMBER: '173'
      OVERMIND_CANDIDATE_NAME: '3.0-candidate.355'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore existing stable signing identity for private candidate artifact only
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          bundle=os.environ.get('SIGNING_BUNDLE','')
          if not bundle: raise RuntimeError('Stable signing identity unavailable; no installable candidate produced')
          obj=json.loads(base64.b64decode(bundle,validate=True))
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero355-candidate.p12'
          key.write_bytes(base64.b64decode(obj['keyStoreBase64'],validate=True));key.chmod(0o600)
          for value in [obj['password'],obj['alias']]:print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('OVERMIND_KEYSTORE_FILE='+str(key)+'\n')
            out.write('OVERMIND_KEYSTORE_PASSWORD='+obj['password']+'\n')
            out.write('OVERMIND_KEY_PASSWORD='+obj['password']+'\n')
            out.write('OVERMIND_KEY_ALIAS='+obj['alias']+'\n')
          PY
      - name: Build private phone candidate, never invoke OTA publisher
        run: gradle --no-daemon assembleRelease
      - name: Verify stable certificate, package, same-version replaceability and source provenance
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p /tmp/zero355-phone-candidate
          apk_path=app/build/outputs/apk/release/app-release.apk
          "$build_tools/apksigner" verify --verbose --print-certs "$apk_path" > /tmp/zero354-certificate.txt
          "$build_tools/aapt" dump badging "$apk_path" > /tmp/zero354-package.txt
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          certificate=pathlib.Path('/tmp/zero354-certificate.txt').read_text()
          expected='45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583'
          assert 'certificate SHA-256 digest: '+expected in certificate
          package=pathlib.Path('/tmp/zero354-package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in package and "versionCode='1173'" in package
          assert "versionName='3.0-candidate.355'" in package
          source=pathlib.Path('app/build/outputs/apk/release/app-release.apk').read_bytes()
          root=pathlib.Path('/tmp/zero355-phone-candidate')
          (root/'ZERO3-candidate-355.apk').write_bytes(source)
          (root/'provenance.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(source).hexdigest(),'bytes':len(source),'applicationId':'com.overmind.zero.ota','versionCode':1173,'versionName':'3.0-candidate.355','certificateSha256':expected,'publication':'private CI artifact; stable OTA172 manifest unchanged'},indent=2))
          print('SIGNED_CANDIDATE_IDENTITY=PASS; no stable OTA publication')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ZERO3-signed-phone-candidate-355
          path: /tmp/zero355-phone-candidate
      - name: Remove temporary private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero355-candidate.p12"
