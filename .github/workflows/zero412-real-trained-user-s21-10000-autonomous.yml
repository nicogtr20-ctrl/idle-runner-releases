name: ZERO412 FIX original USER SAVED S21 trained GRU3 10000 body-inertia context decisions
on:
  push:
    branches: [fix/zero412-observable-inertia-and-ground-contact]
    paths:
      - 'app/src/**'
      - 'app/src/main/java/com/overmind/zero/Zero387TactileFrame.java'
      - 'app/src/main/java/com/overmind/zero/SquareCollisionSolver.java'
      - 'app/src/main/java/com/overmind/zero/TrainingRoomV379.java'
      - 'app/src/main/java/com/overmind/zero/GameActivity.java'
      - 'app/src/androidTest/java/com/overmind/zero/Zero412ActualTrainedS21Original10000DecisionAndroidTest.java'
      - 'app/src/main/java/com/overmind/zero/SymbioteMatterV1.java'
      - 'app/src/main/java/com/overmind/zero/SymbioteWorldStepV171.java'
      - '.github/workflows/zero412-real-trained-user-s21-10000-autonomous.yml'
  workflow_dispatch:
concurrency:
  group: zero412-s21-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions: {contents: read}
jobs:
  original-unseen-10000:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build native original game and Android instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Reconstruct exact real user 33312 GRU3 and training room (read-only)
        run: |
          python3 - <<'PY'
          import json,urllib.request,pathlib
          base='https://raw.githubusercontent.com/nicogtr20-ctrl/idle-runner-releases/zero-telemetry/zero-telemetry/reports/20261025-104220-36e86668b9aff/'
          def get(i):
              req=urllib.request.Request(base+f'part-{i:03d}.json',headers={'User-Agent':'ZERO408-User-S21-Real-State'})
              with urllib.request.urlopen(req,timeout=40) as h:return json.load(h)
          p1=get(1)['currentZero'];p2=get(2)['currentZero']
          fragments=[]
          for i in range(3,22):
              part=get(i)
              assert part['fragmentIndex']==i-3 and part['fragmentCount']==19
              fragments.append(part['jsonFragment'])
          brain=json.loads(''.join(fragments))['zero3_original_brain_only_v356']
          assert len(brain)>300000 and len(json.loads(p2['training_room_1_scene_v379'])['physical']['objects'])>90
          old=dict(p1);old.update(p2)
          fixture=dict(brain=brain,originalPrefs=old,
              training_room_1_scene_v379=p2['training_room_1_scene_v379'],
              training_room_1_free_scene_v379=p2['training_room_1_free_scene_v379'])
          dst=pathlib.Path('/tmp/zero385-user-readonly.json')
          dst.write_text(json.dumps(fixture))
          print('ZERO408_READ_ONLY_REAL_TRAINED_USER_BRAIN_AND_S21_MATERIAL=PASS;len='+str(len(brain)))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 10000 genuine GRU3 choices on exact 33312-trained S21 170-body with independent real inertia and ground contact
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell mkdir -p /sdcard/Android/data/com.overmind.zero.ota/files; adb push /tmp/zero385-user-readonly.json /sdcard/Android/data/com.overmind.zero.ota/files/zero385-user-readonly.json; adb logcat -c; adb shell am instrument -w -r -e class com.overmind.zero.Zero412ActualTrainedS21Original10000DecisionAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000.txt"; adb logcat -d -s ZERO366_REAL:I ZERO397_AUTONOMY:I ZERO400_CREDIT:I ZERO401_CAUSAL:I ZERO404_HAZARD:I ZERO412_USER_S21_LONG:I ActivityTaskManager:I AndroidRuntime:E > "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; cat "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; grep -q "OK (1 test)" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000.txt"; grep -q "ZERO412_REAL_TRAINED_S21_10000_MOTOR_GATE=PASS" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; grep -q "ZERO412_ORIGINAL_USER_S21_10000_RESULT" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; grep -q "ZERO412_TRAINED_S21_1000 decision=" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; grep -q "ZERO412_WALL_TRACTION_STABILITY_10000" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; grep -q "localWeightUpdates=" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000_metrics.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/ZERO412_USER_S21_ORIGINAL_10000.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO412-REAL-TRAINED-S21-original-10000-context-motor
          path: ${{ runner.temp }}/ZERO412_USER_S21_ORIGINAL_10000*.txt
          if-no-files-found: warn
