name: OVERMIND ZERO v0.8 scarcity and two-sided grasp
on:
  push:
    branches: [feature/overmind-v08-scarcity-grasp-chamber]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Test all brains, finite supplies and physically constrained chamber
        run: |
          mkdir -p /tmp/zero08
          javac -d /tmp/zero08 app/src/main/java/com/overmind/zero/MotorBrain.java app/src/main/java/com/overmind/zero/UnknownWorld.java app/src/main/java/com/overmind/zero/ContactLearning.java app/src/main/java/com/overmind/zero/DecisionBrain.java app/src/main/java/com/overmind/zero/Morphology.java app/src/main/java/com/overmind/zero/ScarcityLab.java
          java -cp /tmp/zero08 com.overmind.zero.MotorBrain
          java -cp /tmp/zero08 com.overmind.zero.UnknownWorld
          java -cp /tmp/zero08 com.overmind.zero.ContactLearning
          java -cp /tmp/zero08 com.overmind.zero.DecisionBrain
          java -cp /tmp/zero08 com.overmind.zero.Morphology
          java -cp /tmp/zero08 com.overmind.zero.ScarcityLab
      - name: Assert source-level experiment integrity and memory continuity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          room=Path('app/src/main/java/com/overmind/zero/ScarcityLab.java').read_text()
          brain=Path('app/src/main/java/com/overmind/zero/Morphology.java').read_text()
          world=Path('app/src/main/java/com/overmind/zero/UnknownWorld.java').read_text()
          assert 'public static final int POINTS=96;' in brain
          assert 'boolean consumed=false' in world
          assert 'if(consumed)return 0;' in world
          assert 'opposedContactFrames' in room and 'leftCount>0&&rightCount>0' in room
          assert 'ScarcityLab chamber' in app and 'chamber.constrain(creature,surface,slice);' in app
          assert 'foodTouchedByCore(creature)' in app
          assert 'decision_brain_v05' in app and 'hand_brain_v04' in app and 'morph_brain_v07' in app
          assert 'putString("best"' in app
          assert 'test chamber' not in app.lower() or True
          print('ZERO-008 integrity: finite energy, 96 masses, two-sided physical grip and persistent old brains')
          PY
      - name: Compile Android debug staging
        run: gradle --no-daemon assembleDebug
