name: ZERO 0.10.3 Episodic Live-Loop Regression QA
on:
  push:
    branches: [feature/overmind-v103-episodic-memory-retention]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run real decision-by-decision episodic regression and other brains
        run: |
          mkdir -p /tmp/zero103
          javac -d /tmp/zero103 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec}.java
          for test in EpisodicMemory SensorimotorMind ExperienceCredit LearnedSequencePlanner MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank SaveProfileCodec; do
            java -cp /tmp/zero103 com.overmind.zero.$test
          done
      - name: Protect live history retention and saved memories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          episode=Path('app/src/main/java/com/overmind/zero/EpisodicMemory.java').read_text()
          game=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          save=Path('app/src/main/java/com/overmind/zero/SaveSlotStore.java').read_text()
          assert 'return stored;\n    }\n    private static boolean seenSource' in episode
          assert 'recent.clear();return stored;' not in episode[episode.index('public boolean consequenceSeparated('):episode.index('private static boolean seenSource')]
          assert 'if(recent.size()>=DEPTH)recent.remove(0)' in episode
          assert 'recent.clear();selected=null;' in episode
          assert 'episodic.action(observedBefore,actionBefore);' in game
          assert 'episodic.consequenceSeparated(' in game
          assert 'putString("episodic_memory_v095",episodic.encode())' in game
          assert 'episodic.restore(prefs.getString("episodic_memory_v095",""))' in game
          assert 'zero_save_slots_v100' in save
          assert 'lastAppliedMotor=liveBody.weights(0,trainer.best);' in game
          assert 'episodic.weights(' not in game
          print('Game-loop memory retained across neutral decisions, world model and twelve slots unchanged')
          PY
      - name: Compile Android debug APK
        run: gradle --no-daemon assembleDebug
