      - name: Verify object-memory persistence wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/com/overmind/zero')
          g=(root/'GameActivity.java').read_text()
          b=(root/'SensorimotorMind.java').read_text()
          r=(root/'ResetDomains.java').read_text()
          assert 'putString(ObjectExperienceV20.KEY,objectExperienceV20.encode())' in g
          assert 'objectExperienceV20.restore(' in g
          assert 'attachObjectExperienceV20(objectExperienceV20)' in g
          assert 'ObjectExperienceV20.KEY' in r
          assert 'objectExperience.consequence(' in b
          assert 'objectExperience.choiceBias(' in b
