      - name: Corrective invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/overmind/zero')
          core=(p/'RecurrentCoreV22.java').read_text()
          grip=(p/'SquareGripPuzzle.java').read_text()
          game=(p/'GameActivity.java').read_text()
          mind=(p/'SensorimotorMind.java').read_text()
          assert 'public float[] primaryScores(float[] learnedAffordance)' in core
          assert 'public float primaryExploration(float reserve)' in core
          assert 'ZERO 2.2 PRIMARY:' in core
          assert 'if(activeCore!=null)return choosePrimaryV22(senses);' in mind
          assert 'if(learning&&!holdout&&activeCore==null)' in mind
          assert 'activeCore.chosen(chosen)' in mind
          assert 'new CausalSequenceV23()' in game
          assert 'new SymbioteMatterV1()' in game
          assert 'symMatter.step(creature,surface,symMotor.commands(),slice)' in game
          # Android first draw and Activity resume intentionally provide dt=0.
          # Fluid integration must not observe that zero-duration frame.
          assert 'float dt=lastFrame==0?0:' in game
          assert 'if(!Float.isFinite(slice)||slice<=0f)continue;' in game
          assert game.index('if(!Float.isFinite(slice)||slice<=0f)continue;') < game.index('symMatter.step(creature,surface,symMotor.commands(),slice)')

          assert 'attachSymbioteMotorHead(symMotor)' in game
          assert 'SymbioteMatterV1.ENABLED,true' in (p/'SaveSlotStore.java').read_text()
          assert 'CausalSequenceV23.KEY,causalSequenceV23.encode()' in game
          assert 'learnVerifiedDelayedCredit' in core
          assert 'causalSequence.consequence(after,' in mind
          assert 'energyConfidence(a)' in core
          assert 'stabilizeExistingGrip' in grip
          assert 'environmentEffectSinceAction+=Math.min(2f,actualBoxMotion);' in game
          assert 'Math.max(0f,physicalEffect),learning&&!holdout,holdout,false' in mind
          assert 'box.bilateralHeldNow=opposing&&held>=2' in grip
          assert 'SquareCollisionSolver.finish(body,skin,box)' in grip
          print('Primary recurrent authority, legal physical grip and real effect learning OK')
          PY
