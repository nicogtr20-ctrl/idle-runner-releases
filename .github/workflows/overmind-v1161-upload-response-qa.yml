name: ZERO 0.11.6 GitHub Upload Large-Response Fix QA
on:
  push:
    branches: [feature/overmind-v1161-github-large-response-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify original ZERO brain and physical game are completely unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          base=Path('app/src/main/java/com/overmind/zero')
          pins={
           'SensorimotorMind.java':'c16d3f5b8fd81f6060f5ac732d57a46099ed0179',
           'GameActivity.java':'e7b805047f723f4a528fe05373024382077388ba',
           'InstrumentalNavigation.java':'2eb6390e7e80f17b488f148ec2d76b41e19e27a9',
           'BehavioralLaboratory.java':'e016be507d54b2535885a5c2070951fd9e4c72f7',
           'BehavioralLabActivity.java':'c1e655a947454e2cb77baad6b282890f00097717',
           'ResetDomains.java':'99e0b726e95f96683d5de942da2cb2ff0c9eb318'
          }
          for name,want in pins.items():
            data=(base/name).read_bytes()
            actual=sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert actual==want,(name,actual,want)
          print('All six critical ZERO 0.11.4 behavior files match baseline byte-for-byte.')
          PY
      - name: Regression — GitHub GET 600KB Base64 metadata cannot be silently truncated
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/com/overmind/zero/TelemetryGitHub.java').read_text()
          ui=Path('app/src/main/java/com/overmind/zero/TelemetryActivity.java').read_text()
          assert 'MAX_SUCCESS_RESPONSE=2*1024*1024' in s
          assert 'MAX_ERROR_RESPONSE=12*1024' in s
          assert 'throw new IllegalStateException(' in s and 'Risposta GitHub troppo grande' in s
          assert 'out.size()+n>49152)break;' not in s
          assert 'while((n=stream.read(buffer))!=-1)' in s
          assert 'code>=400?MAX_ERROR_RESPONSE:MAX_SUCCESS_RESPONSE' in s
          assert 'reason.length()>240' in ui
          assert 'reason=reason.replace((char)10' in ui
          assert 'current.optString("sha","")' in s
          assert 'call("PUT",history,token' in s
          assert 'call("PUT",LATEST,token' in s
          assert 'getSharedPreferences(SaveSlotStore.WORKING,Context.MODE_PRIVATE).edit()' not in s
          assert 'AndroidKeyStore' in s and 'AES/GCM/NoPadding' in s
          assert 'SLOTS=12' in (Path('app/src/main/java/com/overmind/zero')/'SaveSlotStore.java').read_text()
          max_report=900*1024
          worst_base64=((max_report+2)//3)*4
          assert worst_base64+64*1024 < 2*1024*1024
          print('GitHub success response capacity > max report Base64 + metadata; no silent truncation, no changing ZERO.')
          PY
      - name: Run historical JVM regressions
        run: |
          mkdir -p /tmp/zero1161
          javac -d /tmp/zero1161 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
          for test in BehavioralLaboratory InstrumentalNavigation GoalContinuity GateBehaviorMetrics CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics SensorimotorMind ExperienceCredit LearnedSequencePlanner MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank; do
            java -cp /tmp/zero1161 com.overmind.zero.$test
          done
      - name: Compile Android with fixed voluntary GitHub sharing
        run: gradle --no-daemon assembleDebug
