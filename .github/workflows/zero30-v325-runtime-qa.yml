name: ZERO3 V3.25 dedicated life runtime and isolated on-device-ready save QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3RuntimeV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RuntimeV325Regression.java'
      - 'app/src/main/java/com/overmind/zero/Zero3AndroidSessionV325.java'
      - 'app/src/main/java/com/overmind/zero/Zero3RuntimeV325TerminalRegression.java'
      - '.github/workflows/zero30-v325-runtime-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile real production material and standalone V3 runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          source=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',source,re.M)
          if not m:raise RuntimeError('production material javac compiler list missing')
          root='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3SurvivalLedgerV323 Zero3SurvivalArchiveV323 Zero3SurvivalRestartV323Regression Zero3RoomStateV324 Zero3RoomArchiveV324 Zero3RuntimeV325 Zero3MotorEvidenceV330 Zero3SegmentedArchiveV328 Zero3ReplayJournalV329 Zero3RuntimeV325Regression Zero3RuntimeV325TerminalRegression Zero3ContactTopologyExperimentV336 Zero3JointBoxConstraintV338 Zero3CausalVitalBoundaryV344 Zero3RecurrentBrain Zero3GruSensoryV347'
          subprocess.run(["javac","-sourcepath","app/src/main/java"]+shlex.split(m.group(1))[1:]+[root+n+'.java' for n in names.split()],check=True)
          PY
      - name: Independent runtime-owner process A, B, C, D on 25 matched lives
        run: |
          set -euo pipefail
          for mode in 0 1 2 3 4; do
            for rep in 0 1 2 3 4; do
              ordinal=$((83+mode+rep*5))
              folder="/tmp/z325-${mode}-${rep}"
              opts="-Dzero3.mode=${mode} -Dzero3.ordinal=${ordinal}"
              java -Xmx1536m $opts -cp /tmp/overmind com.overmind.zero.Zero3RuntimeV325Regression prefix "$folder" | tee "$folder-prefix.log"
              grep -q 'V325 PREFIX 48 DECISIONS / 2 VERIFIED GENERATIONS' "$folder-prefix.log"
              java -Xmx1536m $opts -cp /tmp/overmind com.overmind.zero.Zero3RuntimeV325Regression resume "$folder" "$folder-resumed.txt" | tee "$folder-resumed.log"
              grep -q 'V325 RESUME 96 DECISIONS' "$folder-resumed.log"
              java -Xmx1536m $opts -cp /tmp/overmind com.overmind.zero.Zero3RuntimeV325Regression reference "$folder-reference.txt" | tee "$folder-ref.log"
              cmp "$folder-resumed.txt" "$folder-reference.txt"
              grep -q 'authorityNext=96' "$folder-resumed.txt"
              grep -q 'encoderUpdates=96' "$folder-resumed.txt"
              grep -q 'gripUpdates=96' "$folder-resumed.txt"
              grep -q 'fullReplayRecords=96' "$folder-resumed.txt"
              grep -q 'roomFoodIdentity=true' "$folder-resumed.txt"
              java -Xmx1536m $opts -cp /tmp/overmind com.overmind.zero.Zero3RuntimeV325Regression fault "$folder" | tee "$folder-fault.log"
              grep -q 'V325 FAULT=PASS ROLLBACK_EXACT=48 DOUBLE_BAD_FAIL_CLOSED' "$folder-fault.log"
              echo "ZERO3 V325 NEW_RUNTIME SCENE=${mode} ORDINAL=${ordinal} SAME_LIFE=PASS"
              cat "$folder-resumed.txt"
            done
          done
          echo 'ZERO3 V325 TWENTY_FIVE_RUNTIME_OWNED_SAME_LIFE_PASS'
      - name: Terminal energy depletion persists across cold restart
        run: |
          set -euo pipefail
          java -cp /tmp/overmind com.overmind.zero.Zero3RuntimeV325TerminalRegression /tmp/z325-terminal | tee /tmp/z325-terminal.log
          grep -q 'V325 TERMINAL_FUEL_EXHAUSTION=PASS STOP_EXACTLY_ONE_DECISION=PASS PERSISTENT_DEATH=PASS' /tmp/z325-terminal.log
      - name: Android Debug build, never sign or publish
        run: gradle --no-daemon assembleDebug
      - name: Experimental integrity gates, not motor or integration gate
        run: echo 'V325_RUNTIME_LAB=PASS TERMINAL=PASS GAMEACTIVITY_NOT_CONNECTED G3_BLOCKED G5_BLOCKED G9_DEVICE_BLOCKED NO_OTA'
