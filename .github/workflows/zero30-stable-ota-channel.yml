name: OVERMIND ZERO 3.0 stable OTA channel
on:
  push:
    branches: [release/zero30-ota]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-app-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Validate V3-only motor gain and original world before OTA
        run: |
          grep -F 'DEFAULT_ACTIVATION_GAIN_V358=2.4f' app/src/main/java/com/overmind/zero/Zero3LearningFoundation.java
          grep -F 'brain3.actuate(brain3LifeSerial' app/src/main/java/com/overmind/zero/GameActivity.java
          grep -F 'brain3HarmThisPhysicalFrameV359+=' app/src/main/java/com/overmind/zero/GameActivity.java
          grep -F 'priorDamage=harm;' app/src/main/java/com/overmind/zero/Zero3OriginalBrainV356.java
          grep -F 'float previousDamage=tail==4?d.readFloat():0f;' app/src/main/java/com/overmind/zero/Zero3OriginalBrainV356.java
          grep -F 'CONDIVIDI DATI CON GPT  ↗' app/src/main/java/com/overmind/zero/BrainToolsActivity.java
          grep -F 'index.put("zero3Summary"' app/src/main/java/com/overmind/zero/TelemetryGitHub.java
          grep -F 'zero3Summary",v3' app/src/main/java/com/overmind/zero/TelemetryGitHub.java
          grep -F 'public void step(MotorBrain.Body body,Morphology.Surface skin,float[] cortex,' app/src/main/java/com/overmind/zero/SymbioteMatterV1.java
      - name: Confirm exact original game physics and menu foundation
        run: |
          set -euo pipefail
          for path in \
            app/src/main/java/com/overmind/zero/GameActivity.java \
            app/src/main/java/com/overmind/zero/ScarcityLab.java \
            app/src/main/java/com/overmind/zero/SquareCollisionSolver.java \
            app/src/main/java/com/overmind/zero/SquareGripPuzzle.java; do
              git cat-file -e origin/feature/zero22-active-recurrent-ota117:"$path"
              # Original app's full GameActivity is the comparison authority.
              # V3 physics regressions require extra overloaded test APIs in
              # square/room classes. Default original mechanics remain the
              # same; later physical A/B tests independently verify parity.
              if [[ "$path" == *GameActivity.java ]]; then
                python3 - <<'PY'
          from pathlib import Path
          from difflib import SequenceMatcher
          import subprocess
          name='app/src/main/java/com/overmind/zero/GameActivity.java'
          a=subprocess.check_output(['git','show','origin/feature/zero22-active-recurrent-ota117:'+name]).decode()
          b=Path(name).read_text()
          score=SequenceMatcher(None,a.splitlines(),b.splitlines(),autojunk=False).ratio()
          assert score>.91, f'Original game Java drifted: similarity={score:.3f}'
          for essential in ['void updateHabitat(float dt)','void resolveObjects(float dt)',
                            'void resetEpisode()','void saveScene()','boolean restoreScene',
                            'void renderWorld(Canvas c)','void renderBody(Canvas c)',
                            'void renderHud(Canvas c)','void renderDock(Canvas c)',
                            'void renderSettings(Canvas c)','void settingsChoice(int index)']:
            assert essential in b, essential
          assert 'zero3.step()' not in b and 'drawZero3(' not in b
          print('ORIGINAL_GAME_UI_PHYSICS_STRUCTURE=PASS, similarity=',round(score,4))
          PY
              fi
          done
      # V364: hard hold signed OTA while original V3 moves AGAINST its own
      # requested left/south headings. Compilation is not behavioral success.
      - name: HARD STOP incorrect direction in true V3 material motor
        run: python3 tools/zero364_g3_physical_ota_gate.py
      - name: Android compile and original existing test suite
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: No V355 dashboard as launcher / no signed publisher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          assert 'Zero3DashboardActivityV354.class' not in code or 'new android.content.Intent' in code
          assert 'drawZero3(' not in code
          assert 'zero3.step()' not in code
          assert 'void resetEpisode()' in code
          print('ORIGINAL_GAME_OWNER_STATIC=PASS; no independent V355 game runtime')
          PY
  motor-ab-and-android:
    needs: [original-app-compile]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: 'V363 qualification: same physical V3 motor A/B plus actual GPT share screen and telemetry in emulator'
        run: python3 tools/zero358_motor_audit.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: V363 original game, red harm, legacy saves, real V3 GPT share UI, report/index and restarts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/zero363_android_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V362-GPT-sharing-real-V3-neural-index-original-game-QA
          path: /tmp/zero356-ui


  signed-ota-release:
    needs: [original-app-compile, motor-ab-and-android]
    if: github.ref == 'refs/heads/release/zero30-ota'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OVERMIND_BUILD_NUMBER: '181'
      OVERMIND_CANDIDATE_NAME: '3.0-ota.363'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: OTA monotonicity and channel safety gate
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          import json,subprocess
          old=json.loads(subprocess.check_output(['git','show','origin/main:updater/public/latest.json'],text=True))
          assert old['applicationId']=='com.overmind.zero.ota'
          assert int(old['versionCode'])<1181, 'OTA already published or newer! Stop rather than downgrade'
          assert old['available'] is True
          assert int(old['versionCode'])>=1180, 'V362 OTA must be the previous published baseline'
          print('V363 OTA safe upgrade: old code',old['versionCode'],'new code 1181; previous public V362=1180')
          PY
      - name: Restore stable Android signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.OVERMIND_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          bundle=os.environ.get('SIGNING_BUNDLE','')
          if not bundle:raise RuntimeError('Stable signing credentials unavailable')
          obj=json.loads(base64.b64decode(bundle,validate=True))
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'zero363-stable-ota.p12'
          key.write_bytes(base64.b64decode(obj['keyStoreBase64'],validate=True));key.chmod(0o600)
          for value in [obj['password'],obj['alias']]:print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('OVERMIND_KEYSTORE_FILE='+str(key)+'\n')
              env.write('OVERMIND_KEYSTORE_PASSWORD='+obj['password']+'\n')
              env.write('OVERMIND_KEY_PASSWORD='+obj['password']+'\n')
              env.write('OVERMIND_KEY_ALIAS='+obj['alias']+'\n')
          PY
      - name: Assemble OTA363 Android signed APK
        run: gradle --no-daemon assembleRelease
      - name: Verify package, version, original stable certificate and updater rights
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$bt/apksigner" verify --print-certs --verbose "$apk" > "$RUNNER_TEMP/cert.txt"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          "$bt/aapt" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
          "$bt/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          c=(Path(os.environ['RUNNER_TEMP'])/'cert.txt').read_text()
          assert 'Number of signers: 1' in c
          assert 'certificate SHA-256 digest: 45010684b4fd74de00f87fb81ca89e1e79b58409cf9fefc497b445b0fe19f583' in c
          badging=(Path(os.environ['RUNNER_TEMP'])/'package.txt').read_text()
          assert "package: name='com.overmind.zero.ota'" in badging
          assert "versionCode='1181'" in badging and "versionName='3.0-ota.363'" in badging
          perms=(Path(os.environ['RUNNER_TEMP'])/'permissions.txt').read_text()
          for p in ('android.permission.INTERNET','android.permission.REQUEST_INSTALL_PACKAGES'):
              assert p in perms
          assert 'com.overmind.zero.UpdateFileProvider' in (Path(os.environ['RUNNER_TEMP'])/'manifest.txt').read_text()
          m=json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())['elements'][0]
          assert m['versionCode']==1181 and m['versionName']=='3.0-ota.363'
          print('V363 STABLE_PACKAGE_SIGNING_VERSION_UPDATER=PASS')
          PY
      - name: Preserve signed OTA363 APK before publication
        uses: actions/upload-artifact@v4
        with:
          name: ZERO3-stable-OTA363-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable GitHub Release and OTA manifest for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          sha=$(sha256sum "$apk" | awk '{print $1}')
          bytes=$(wc -c < "$apk" | tr -d ' ')
          tag=overmind-zero-v3.0-ota.363
          mkdir -p "$RUNNER_TEMP/ota363"
          cp "$apk" "$RUNNER_TEMP/ota363/OVERMIND-ZERO.apk"
          cat > "$RUNNER_TEMP/ota363/notes.md" <<'NOTES'
          OVERMIND ZERO 3.0 OTA363 — attrito passivo calibrato e apprendimento motorio delle prese volontarie.
          ZERO 3.0 usa un attrito passivo del corpo sul terreno 0,08 anziché 0,12. La forza muscolare non aumenta.
          Prova fisica originale 1.200 decisioni: gross +30,65%, progresso nella direzione di prova +33,52%,
          lavoro +4,52%, ma NON prova di navigazione autonoma o raccolta gemme.
          Prove di direzione indipendenti: vantaggio 3/4 direzioni; sinistra/sud ancora problematici.
          La presa vera voluta da ZERO non viene classificata automaticamente come forza esterna.
          Collisioni con spostamento forzato, oggetti mossi e tempeste restano escluse dal credito motorio.
          Vecchia fisica 2.2 con baseline 0,12 invariata. Nessuna andatura obbligata né direzione preimpostata.
          Pesi GRU, sinapsi motorie e ricordi salvati V356 mantenuti senza reset. Menu, scene, oggetti e premi invariati.
          TEST REALI su telefono (velocità utile, direzioni, risorse) ancora necessari.
          APK firmato con il certificato OTA storico; versionCode 1181. Aggiornare in-app, mai disinstallare.

          NOTES
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1;then
            mkdir -p "$RUNNER_TEMP/ota363/existing"
            gh release download "$tag" --repo "${{ github.repository }}" -p OVERMIND-ZERO.apk -D "$RUNNER_TEMP/ota363/existing"
            cmp "$apk" "$RUNNER_TEMP/ota363/existing/OVERMIND-ZERO.apk" || { echo "Existing OTA363 release differs";exit 1; }
          else
            gh release create "$tag" "$RUNNER_TEMP/ota363/OVERMIND-ZERO.apk" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title 'OVERMIND ZERO 3.0 OTA363' \
              --notes-file "$RUNNER_TEMP/ota363/notes.md"
          fi
          git fetch --no-tags origin main
          git checkout -B main origin/main
          mkdir -p updater/public/apk
          filename="overmind-zero-1181-${sha:0:12}.apk"
          cp "$RUNNER_TEMP/ota363/OVERMIND-ZERO.apk" "updater/public/apk/$filename"
          python3 - "$filename" "$sha" "$bytes" <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          filename,sha,size=sys.argv[1:]
          target=Path('updater/public/latest.json')
          current=json.loads(target.read_text())
          if int(current['versionCode'])>=1181:
              raise RuntimeError('Newer OTA published concurrently; never overwrite')
          data={
            'schemaVersion':1,'available':True,
            'applicationId':'com.overmind.zero.ota',
            'versionCode':1181,'versionName':'3.0-ota.363',
            'apkUrl':'https://overmind-zero-updates.vercel.app/apk/'+filename,
            'sha256':sha,'sizeBytes':int(size),
            'notes':'ZERO 3.0 OTA363: migliore mobilità fisica del simbionte, attrito calibrato, prese volontarie ammesse all’apprendimento; pesi conservati',
            'publishedAt':datetime.now(timezone.utc).isoformat()}
          target.write_text(json.dumps(data,indent=2)+'\n')
          with open('docs/CHANGELOG.md','a') as out:
              out.write('\n## ZERO 3.0 OTA363 — '+data['publishedAt']+'\n')
              out.write('- V363: attrito passivo V3 0.12→0.08 solo nel simbionte originale, 2.2 invariato; no aumento muscolare.\n')
              out.write('- Apprendimento include prese autonome reali, non urti forzati; nuova prova A/B originale train/frozen, 4 direzioni, emulator V361–363.\n')
              out.write('- APK firmato con il certificato originale, versione 1181, SHA-256 `'+sha+'`.\n')
          print('OTA363 manifest ready:',data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updater/public/latest.json "updater/public/apk/$filename" docs/CHANGELOG.md
          git commit -m 'Publish ZERO3 OTA363 measured passive locomotor traction and correct autonomous grip learning'
          git push origin HEAD:main
          echo "OTA363_PUBLISHED_MAIN_MANIFEST=PASS SHA256=$sha"
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/zero363-stable-ota.p12"
