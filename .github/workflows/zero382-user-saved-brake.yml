name: ZERO382 real user 381 saved motor & resume + braking A/B
on:
  push:
    branches: [fix/zero382-resume-and-physical-turn-braking]
    paths: ['.github/workflows/zero382-user-saved-brake.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-real-user-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Restore USER-EXPLICIT-SHARED brain only ephemerally
        run: |
          set -euo pipefail
          git fetch origin zero-telemetry
          python3 - <<'PY'
          import subprocess,json,os,hashlib,pathlib
          b="zero-telemetry/reports/20261023-133146-3182a05bea513"
          def read(path):
              return subprocess.check_output(["git","show","origin/zero-telemetry:"+path])
          index=json.loads(read("zero-telemetry/current.json"))
          assert index["reportId"]==b.split("/")[-1]
          assert index["installedVersionCode"]==1191
          assert index["zero3Summary"]["completedDecisions"]==9997
          parts={e["path"]:e for e in index["parts"]}
          def verified(path):
              raw=read(path)
              assert hashlib.sha256(raw).hexdigest()==parts[path]["sha256"]
              return json.loads(raw)
          old=verified(b+"/part-001.json")["currentZero"]["symbiote_motor_head_v1"]
          aux=verified(b+"/part-002.json")["currentZero"]["zero3_motor_flight_recorder_v381"]
          response=index["currentZero"]["zero3_physical_response_calibration_v381"]
          segments=[]
          for i in range(3,21):
              name=b+f"/part-{i:03}.json"
              doc=verified(name)
              assert doc["key"]=="zero3_original_brain_only_v356"
              assert doc["fragmentIndex"]==i-3 and doc["fragmentCount"]==18
              segments.append(doc["jsonFragment"])
          brain=json.loads("".join(segments))["zero3_original_brain_only_v356"]
          assert len(brain)>500000 and old.startswith("smh1|")
          assert aux.startswith("zmf381|1|9997")
          dest=pathlib.Path(os.environ["RUNNER_TEMP"])/"zero382-uploaded-checkpoint.json"
          dest.write_text(json.dumps({"brain":brain,"motorHead":old,
              "flight":aux,"calibration":response}),encoding="utf-8")
          dest.chmod(0o600)
          print("USER381_EXACT_VALID_CHECKPOINT_LOADED_EPHEMERALLY_NO_PRIVATE_WEIGHTS_LOGGED")
          PY
      - name: Compile complete original Android physical simulator
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Genuine same-state V381 saved cortex brain-safe resume and traction A/B
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; adb shell mkdir -p /sdcard/Android/data/com.overmind.zero.ota/files; adb push "$RUNNER_TEMP/zero382-uploaded-checkpoint.json" /sdcard/Android/data/com.overmind.zero.ota/files/zero382-uploaded-checkpoint.json >/dev/null; adb shell am instrument -w -r -e class com.overmind.zero.Zero382UserSavedBodyBrakeAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/zero382-user-save-results.txt"; grep -q "OK (1 test)" "$RUNNER_TEMP/zero382-user-save-results.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/zero382-user-save-results.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO382-real-user-brake-aggregates-only
          path: ${{ runner.temp }}/zero382-user-save-results.txt
          if-no-files-found: warn
      - name: Destroy temporary original user brain
        if: always()
        run: rm -f "$RUNNER_TEMP/zero382-uploaded-checkpoint.json"
