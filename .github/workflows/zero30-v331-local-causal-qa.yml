name: ZERO3 V3.31 true-physics local actuator +/- causal and delayed response
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3LocalCausalFieldV331.java'
      - 'app/src/main/java/com/overmind/zero/Zero3LocalCausalFieldV331Regression.java'
      - '.github/workflows/zero30-v331-local-causal-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-physical-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile UNMODIFIED original body and all actual world contact solvers
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          src=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',src,re.M)
          if not m:raise RuntimeError('production solver compile command missing')
          root='app/src/main/java/com/overmind/zero/'
          names='Zero3LearningFoundation Zero3MotorResponseKernel Zero3MotorRetentionRegression Zero3MotorPromotionGate Zero3MotorImpulseResponseRegression Zero3MotorLocalFrameV310Regression Zero3SensoryFrameV315 Zero3CausalRecorderV315 Zero3SensoryContractV315Regression Zero3MotorIntentV316 Zero3AutonomousLoopV317 Zero3LearnedAdhesionV318 Zero3LearnedAdhesionV318Regression Zero3ContextAdhesionV319 Zero3ContextAdhesionV319Regression Zero3MotorHeadStoreV320 Zero3NeuralBundleStoreV321 Zero3OrganismStoreV322 Zero3FullCausalExperienceV322B Zero3FullArchiveStoreV322B Zero3MultiSceneRestartV322BRegression Zero3LocalCausalFieldV331 Zero3LocalCausalFieldV331Regression'
          subprocess.run(shlex.split(m.group(1))+[root+n+'.java' for n in names.split()],check=True)
          PY
      - name: Execute 576 independent triples with 12 intervention and 24 late real solver frames
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3LocalCausalFieldV331Regression | tee /tmp/v331.log
          grep -q 'matchedTriplets=576' /tmp/v331.log
          grep -q 'technicalCounterfactualIntegrity=PASS' /tmp/v331.log
          grep -q 'G3_MOTOR_SKILL_BLOCKED G5_BLOCKED NO_OTA' /tmp/v331.log
          test "$(grep -c 'ZERO3 V331 FAMILY=' /tmp/v331.log)" -eq 4
      - name: Android Debug compile only not OTA or Play Store
        run: gradle --no-daemon assembleDebug
      - name: Distinguish physical response from learned motor competence
        run: echo 'ZERO3 V331_INFRASTRUCTURE=PASS PHYSICAL_CREDIT_DIAGNOSTIC_ONLY G3_BLOCKED NO_OTA'
