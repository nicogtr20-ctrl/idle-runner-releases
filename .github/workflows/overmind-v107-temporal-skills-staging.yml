name: ZERO 0.10.7 Temporal Skills QA
on:
  push:
    branches: [feature/overmind-v107-temporal-skills]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Run autonomous temporal skill and regression tests
        run: |
          mkdir -p /tmp/zero107
          javac -d /tmp/zero107 app/src/main/java/com/overmind/zero/{TemporalSkillBank,TemporalWorkingMemory,LifeStatistics,MotorBrain,UnknownWorld,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec}.java
          for test in TemporalSkillBank TemporalWorkingMemory SensorimotorMind LearnedSequencePlanner ExperienceCredit EpisodicMemory LearningDiagnostics LifeStatistics MotorBrain UnknownWorld ContactLearning DecisionBrain Morphology ScarcityLab OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank SaveProfileCodec; do
            java -cp /tmp/zero107 com.overmind.zero.$test
          done
      - name: Verify skill chunks are discovered, not scripted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          k=Path('app/src/main/java/com/overmind/zero/TemporalSkillBank.java').read_text()
          s=Path('app/src/main/java/com/overmind/zero/SensorimotorMind.java').read_text()
          g=Path('app/src/main/java/com/overmind/zero/GameActivity.java').read_text()
          r=Path('app/src/main/java/com/overmind/zero/ResetDomains.java').read_text()
          b=Path('app/src/main/java/com/overmind/zero/BrainStatsActivity.java').read_text()
          gradle=Path('app/build.gradle').read_text()
          assert 'MAX_SKILLS=24,MIN_LEN=2,MAX_LEN=8' in k
          assert 'if(confirmations<2)return 0' in k
          assert 'discoverFromRecent' in k and 'findMatch' in k
          assert 'd>CONTINUE_MATCH' in k
          assert 'ScarcityLab' not in k and 'UnknownWorld.Entity' not in k
          assert 'door' not in k.lower() and 'gate' not in k.lower()
          assert 'temporalSkills.advice(temporalContext,temporal.confidence())' in s
          assert 'temporalSkills.chosen(temporalContext,chosen)' in s
          assert 'temporalSkills.transition(temporal.contextCopy())' in s
          assert 'temporalSkills.physicalOutcome(physicalEffect)' in s
          assert 'temporal_skills_v107' in g
          assert 'takeTemporalSkillsDirty' in g
          assert 'TEMPORAL_SKILLS="temporal_skills"' in r
          assert 'ABILITA TEMPORALI AUTONOME' in b
          assert '0.10.7-ota' in gradle
          print('ZERO 0.10.7 QA: recurrently discovered 2-8 step skills, repeat-only consolidation, context abort, persistent bank')
          PY
      - name: Compile Android Debug APK
        run: gradle --no-daemon assembleDebug
