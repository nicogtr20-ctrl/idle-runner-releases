name: ZERO384 embodied proprioception and physically learned obstruction (no OTA)
on:
  push:
    branches: [fix/zero384-embodied-proprio-obstacle-learning]
    paths:
      - 'app/src/**'
      - '.github/workflows/zero384-embodied-proprio-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-body:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build production Java/Android and regression APK
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measured proprioception, old cold-start and original physics regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for fixture in Zero384EmbodiedProprioAndroidTest Zero382ColdResumeAndroidTest Zero381PhysicalMotorCalibrationAndroidTest Zero380FailureReproductionAndroidTest Zero379SingleTrainingRoomAndroidTest Zero378PhysicalMotorCreditAndroidTest Zero377TrueInertialMotorAndroidTest Zero364MotorBridgeAndroidTest; do echo "RUN $fixture"; adb shell am instrument -w -r -e class "com.overmind.zero.$fixture" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$fixture.txt"; grep -q "OK (" "$RUNNER_TEMP/$fixture.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$fixture.txt"; done'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero384-embodied-qa
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
