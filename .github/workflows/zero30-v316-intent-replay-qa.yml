name: ZERO3 V3.16 sole motor intent and two-generation replay QA
on:
  push:
    branches: [feature/zero30-foundation-g0-g3-20261016]
    paths:
      - 'app/src/main/java/com/overmind/zero/Zero3MotorIntentV316.java'
      - 'app/src/main/java/com/overmind/zero/Zero3ExperienceJournalV316.java'
      - 'app/src/main/java/com/overmind/zero/Zero3IntentPersistenceV316Regression.java'
      - '.github/workflows/zero30-v316-intent-replay-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sole-intent-durable-real-experiences:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile unchanged production gel and immutable 3.15/3.16 contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/overmind
          python3 - <<'PY'
          import pathlib,re,shlex,subprocess
          source=pathlib.Path('.github/workflows/overmind-ota-publish.yml').read_text()
          m=re.search(r'^\s*(javac -d /tmp/overmind [^\n]+)',source,re.M)
          if not m:raise RuntimeError('Production solver javac list missing')
          root='app/src/main/java/com/overmind/zero/'
          models=['Zero3LearningFoundation.java','Zero3MotorResponseKernel.java',
            'Zero3MotorRetentionRegression.java','Zero3MotorPromotionGate.java',
            'Zero3MotorImpulseResponseRegression.java',
            'Zero3MotorLocalFrameV310Regression.java',
            'Zero3SensoryFrameV315.java','Zero3CausalRecorderV315.java',
            'Zero3SensoryContractV315Regression.java',
            'Zero3MotorIntentV316.java','Zero3ExperienceJournalV316.java',
            'Zero3IntentPersistenceV316Regression.java']
          subprocess.run(shlex.split(m.group(1))+[root+x for x in models],check=True)
          PY
      - name: Test 2048 real actions 4 atomic generation switch and corruption recovery
        run: |
          set -euo pipefail
          java -Xmx1536m -cp /tmp/overmind com.overmind.zero.Zero3IntentPersistenceV316Regression | tee /tmp/v316.txt
          grep -q 'realActions=2048 gelSolverSteps=3584 checkpoints=4' /tmp/v316.txt
          grep -q 'fullSensoryRoundtrips=2048 typedSoleOwner=true' /tmp/v316.txt
          grep -q 'rollbackAfterCorruptNewest=1536' /tmp/v316.txt
          grep -q 'ZERO3 V316 GATE=PASS' /tmp/v316.txt
          grep -q 'G3_BLOCKED G5_BLOCKED NO_OTA' /tmp/v316.txt
