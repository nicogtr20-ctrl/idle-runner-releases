name: ZERO390 isolated single-sector GRU3 motor evidence and real S21 save checks
on:
  push:
    branches: [fix/zero390-isolated-motor-credit-wall-validity]
    paths: ['app/src/**','.github/workflows/zero390-causal-muscle-qa.yml']
  pull_request:
    branches: [audit/zero389-v388-actual-33312-obstacle-motor-causal]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: zero390-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-physical-motor:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android app and instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Motor eligibility, cortex GRU3 brain continuity, tactile and inertial regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            bash -c 'set -euo pipefail; adb install -r app/build/outputs/apk/debug/app-debug.apk; adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk; for test in Zero390IsolatedMotorCreditAndroidTest Zero387TactileContactAndroidTest Zero387DirectMotorCalibrationAndroidTest Zero386EffortAuthorityAndroidTest Zero384EmbodiedProprioAndroidTest Zero382ColdResumeAndroidTest; do adb shell am instrument -w -r -e class "com.overmind.zero.$test" com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/$test.txt"; grep -q "OK (" "$RUNNER_TEMP/$test.txt"; ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/$test.txt"; done; grep -q "OK (4 tests)" "$RUNNER_TEMP/Zero390IsolatedMotorCreditAndroidTest.txt"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero390-original-android-cortex-eligibility
          path: ${{ runner.temp }}/Zero*.txt
          if-no-files-found: warn
