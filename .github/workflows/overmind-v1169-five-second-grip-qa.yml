name: ZERO 1169 Five Second Sustained Grip QA
on:
  push:
    branches: [fix/overmind-v1169-five-second-grip-dwell]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile real physics and learned-body model
        run: |
          mkdir -p /tmp/zero1169
          javac -d /tmp/zero1169 app/src/main/java/com/overmind/zero/{MotorBrain,UnknownWorld,OpticalCues,OpticalCueRegression,HabitatContinuity,SquareCollisionSolver,SquareGripPuzzle,GripParityRegression,WorldPlacement,ContactLearning,DecisionBrain,Morphology,ScarcityLab,SensorimotorMind,DecisionBlackbox,GateLifeJournal,ContextualMotionProbe,ShadowNonInterferenceRegression,SpatialPerception,CausalExperiments,BodyProprioception,InstrumentalNavigation,GoalContinuity,GateBehaviorMetrics,BehavioralLaboratory,TemporalWorkingMemory,TemporalSkillBank,TemporalPersistenceRegression,LearnedSequencePlanner,LearningDiagnostics,ResetDomains,OnlineBodyLearning,MotionExploration,EpisodicMemory,MotorAutonomyGuard,MotorSkillBank,ExperienceCredit,GripSkillBank,SaveProfileCodec,LifeStatistics}.java
      - name: Verify gate and square require five continuous seconds before physical hold
        run: java -cp /tmp/zero1169 com.overmind.zero.GripParityRegression
      - name: Run all original physical and cognitive regression tests
        run: |
          for test in SquareCollisionSolver SquareGripPuzzle HabitatContinuity OpticalCueRegression ShadowNonInterferenceRegression GateLifeJournal ContextualMotionProbe GateBehaviorMetrics WorldPlacement UnknownWorld ScarcityLab BehavioralLaboratory InstrumentalNavigation GoalContinuity CausalExperiments SpatialPerception BodyProprioception TemporalPersistenceRegression TemporalWorkingMemory TemporalSkillBank SaveProfileCodec EpisodicMemory LifeStatistics SensorimotorMind ExperienceCredit LearnedSequencePlanner MotorBrain ContactLearning DecisionBrain Morphology OnlineBodyLearning MotionExploration ResetDomains MotorAutonomyGuard MotorSkillBank GripSkillBank DecisionBlackbox; do
            java -cp /tmp/zero1169 com.overmind.zero.$test
          done
      - name: Compile Android APK debug with old saves
        run: gradle --no-daemon assembleDebug
