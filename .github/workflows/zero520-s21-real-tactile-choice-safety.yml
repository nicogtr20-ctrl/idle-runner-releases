name: ZERO520 actual S21 touched-wall choice safety Android
on:
  push:
    branches: [lab/zero520-live-tactile-real-impasse-choice]
  workflow_dispatch:
concurrency:
  group: zero417-s21-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  original-unseen-10000:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build native original game and Android instrumentation
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Reconstruct exact real user 33312 GRU3 and training room (read-only)
        run: |
          python3 - <<'PY'
          import json,urllib.request,pathlib
          base='https://raw.githubusercontent.com/nicogtr20-ctrl/idle-runner-releases/zero-telemetry/zero-telemetry/reports/20261025-104220-36e86668b9aff/'
          def get(i):
              req=urllib.request.Request(base+f'part-{i:03d}.json',headers={'User-Agent':'ZERO408-User-S21-Real-State'})
              with urllib.request.urlopen(req,timeout=40) as h:return json.load(h)
          p1=get(1)['currentZero'];p2=get(2)['currentZero']
          fragments=[]
          for i in range(3,22):
              part=get(i)
              assert part['fragmentIndex']==i-3 and part['fragmentCount']==19
              fragments.append(part['jsonFragment'])
          brain=json.loads(''.join(fragments))['zero3_original_brain_only_v356']
          assert len(brain)>300000 and len(json.loads(p2['training_room_1_scene_v379'])['physical']['objects'])>90
          old=dict(p1);old.update(p2)
          fixture=dict(brain=brain,originalPrefs=old,
              training_room_1_scene_v379=p2['training_room_1_scene_v379'],
              training_room_1_free_scene_v379=p2['training_room_1_free_scene_v379'],
              motorRecorderCsv=p2['zero3_motor_flight_recorder_v381'])
          dst=pathlib.Path('/tmp/zero385-user-readonly.json')
          dst.write_text(json.dumps(fixture))
          print('ZERO408_READ_ONLY_REAL_TRAINED_USER_BRAIN_AND_S21_MATERIAL=PASS;len='+str(len(brain)))
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual saved 96-patch S21 tactile and learned hazard choice safety
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Android/data/com.overmind.zero.ota/files
            adb push /tmp/zero385-user-readonly.json /sdcard/Android/data/com.overmind.zero.ota/files/zero385-user-readonly.json
            adb logcat -c
            adb shell am instrument -w -r -e class com.overmind.zero.Zero520ActualS21TactileChoiceGateAndroidTest com.overmind.zero.ota.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee "$RUNNER_TEMP/ZERO520_GEOMETRY_AB.txt"
            adb logcat -d -s ZERO520_GEOMETRY:I > "$RUNNER_TEMP/ZERO520_GEOMETRY_METRICS.txt"
            cat "$RUNNER_TEMP/ZERO520_GEOMETRY_METRICS.txt"
            grep -q "OK (1 test)" "$RUNNER_TEMP/ZERO520_GEOMETRY_AB.txt"
            grep -q "REAL_S21_TACTILE_CHOICE_GEOMETRY_AND_NEGATIVE_HARM_GATES_PASS" "$RUNNER_TEMP/ZERO520_GEOMETRY_METRICS.txt"
            ! grep -qE "FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed" "$RUNNER_TEMP/ZERO520_GEOMETRY_AB.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZERO520-real-S21-tactile-safety
          path: ${{ runner.temp }}/ZERO520_GEOMETRY_*.txt
          if-no-files-found: warn

# V443 final original Android four-gate SHA: diagnostic-only score eligibility.

# ZERO477 final same-SHA run gate: passive braking mid-bank counterexample + original 2x10000 + CRC; no release.

# ZERO486 exact original 4-gate same-SHA diagnostic: observed-only historical baseline vs matched motor causal oracle. No live credit change.
